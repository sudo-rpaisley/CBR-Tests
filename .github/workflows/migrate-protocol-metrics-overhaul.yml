name: Migrate protocol metrics out of tests (overhaul)

on:
  push:
    branches:
      - overhaul/metric-conformance

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/metric-conformance

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Move protocol/network handlers into production package
        run: |
          rm -rf cbr_tests/metrics/protocol_network
          cp -R tests/metrics/dataset_heuristics/protocol_and_network_realism cbr_tests/metrics/protocol_network

          python - <<'PY'
          from pathlib import Path

          dispatch = Path('runner/dispatch.py')
          text = dispatch.read_text()
          old_prefix = 'from tests.metrics.dataset_heuristics.protocol_and_network_realism.'
          new_prefix = 'from cbr_tests.metrics.protocol_network.'
          if old_prefix not in text:
              raise SystemExit('protocol/network test-package imports were not found in runner/dispatch.py')
          dispatch.write_text(text.replace(old_prefix, new_prefix))

          old_root = Path('tests/metrics/dataset_heuristics/protocol_and_network_realism')
          for source in sorted(old_root.rglob('*.py')):
              if source.name == '__init__.py':
                  continue
              rel = source.relative_to(old_root).with_suffix('')
              module = 'cbr_tests.metrics.protocol_network.' + '.'.join(rel.parts)
              source.write_text(
                  '"""Compatibility imports for the former protocol/network metric location."""\n\n'
                  f'from {module.rsplit(".", 1)[0]} import {module.rsplit(".", 1)[1]} as _impl\n\n'
                  'globals().update(\n'
                  '    {name: getattr(_impl, name) for name in dir(_impl) if not name.startswith("__")}\n'
                  ')\n\n'
                  '__all__ = [name for name in globals() if not name.startswith("__")]\n'
              )
          PY

      - name: Regenerate generated documentation
        run: python scripts/build_reference_documentation.py

      - name: Verify migration
        run: |
          python -m compileall -q cbr_tests runner tests
          if grep -qE '^from tests\.' runner/dispatch.py; then
            echo 'runner/dispatch.py still imports production handlers from tests/' >&2
            grep -nE '^from tests\.' runner/dispatch.py >&2 || true
            exit 1
          fi
          if grep -R -nE '^from tests\.|^import tests\.' cbr_tests/metrics/protocol_network; then
            echo 'migrated production modules still import tests/' >&2
            exit 1
          fi
          python -m pytest -q

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cbr_tests/metrics/protocol_network tests/metrics/dataset_heuristics/protocol_and_network_realism runner/dispatch.py docs/function_reference.md docs/test_reference.md
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m "Move protocol network metrics into production package"
          git push origin HEAD:overhaul/metric-conformance
