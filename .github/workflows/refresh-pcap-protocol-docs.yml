name: Refresh PCAP protocol references

on:
  push:
    branches:
      - agent/pcap-canonical-adapter

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pcap-canonical-adapter
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate protocol and PCAP changes
        run: |
          python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
          python -m pytest -q tests/test_protocol_validity_profile.py tests/test_pcap_adapter.py tests/test_plan_builder.py
          python -m pytest -q
      - name: Regenerate references
        run: python scripts/build_reference_documentation.py
      - name: Commit generated references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/function_reference.md docs/test_reference.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh references for PCAP protocol checks"
            git push origin HEAD:agent/pcap-canonical-adapter
          fi
