name: Regenerate reference docs (temporary)

on:
  pull_request:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'fix/bounded-statistical-memory'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate AST references
        run: python scripts/build_reference_documentation.py

      - name: Commit generated references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/function_reference.md docs/test_reference.md
          if git diff --cached --quiet; then
            echo "Generated references already current."
          else
            git commit -m "Regenerate reference documentation"
            git push origin HEAD:${{ github.head_ref }}
          fi
