name: Regenerate generated references (temporary)

on:
  push:
    branches:
      - experiment-finalisation
    paths:
      - '.github/workflows/regenerate-docs-temp.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-finalisation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate references
        run: python scripts/build_reference_documentation.py
      - name: Commit generated references
        run: |
          if git diff --quiet -- docs/function_reference.md docs/test_reference.md; then
            echo 'Generated references are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/function_reference.md docs/test_reference.md
          git commit -m 'Refresh generated reference documentation'
          git push origin HEAD:experiment-finalisation
