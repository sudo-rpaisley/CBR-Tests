name: Recover all runnable PCAP metrics

on:
  push:
    branches:
      - agent/pcap-all-runnable-metrics

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pcap-all-runnable-metrics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Replay implementation patch and repair generated test
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/apply-pcap-all-runnable.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end]) + '\n'
          Path('/tmp/apply_pcap.py').write_text(script, encoding='utf-8')
          subprocess.run(['python', '/tmp/apply_pcap.py'], check=True)

          test_path = Path('tests/test_pcap_all_runnable_metrics.py')
          broken = test_path.read_text(encoding='utf-8')
          if '\\n' in broken:
              test_path.write_text(broken.replace('\\n', '\n'), encoding='utf-8')
          PY
      - name: Validate implementation
        run: |
          python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
          python -m pytest -q tests/test_pcap_adapter.py tests/test_pcap_all_runnable_metrics.py tests/test_plan_builder.py tests/test_temporal_metrics_profile.py
          python -m pytest -q
      - name: Regenerate references
        run: python scripts/build_reference_documentation.py
      - name: Verify references and docs
        run: |
          git diff --check
          python scripts/build_reference_documentation.py --check
      - name: Commit implementation and remove temporary workflows
        run: |
          rm -f .github/workflows/apply-pcap-all-runnable.yml .github/workflows/recover-pcap-all-runnable.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Run all safe existing metrics on raw PCAP"
          git push origin HEAD:agent/pcap-all-runnable-metrics
