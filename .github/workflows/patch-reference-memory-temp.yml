name: Apply reference-memory hardening (temporary)

on:
  push:
    branches:
      - experiment-finalisation
    paths:
      - '.github/workflows/patch-reference-memory-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-finalisation
      - name: Apply exact source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('cbr_tests/metrics/reference_comparison.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'from runner.pcap_adapter import build_pcap_packet_dataframe, is_packet_capture':
                  'from runner.pcap_adapter import is_packet_capture\nfrom runner.pcap_compact import build_compact_pcap_packet_dataframe',
              'return dataframe.rename(columns=rename_map)':
                  'return dataframe.rename(columns=rename_map, copy=False)',
              'return _apply_reference_field_map(shared.copy(), metric)':
                  'return _apply_reference_field_map(shared, metric)',
              'return _apply_reference_field_map(cached.copy(), metric)':
                  'return _apply_reference_field_map(cached, metric)',
              'dataframe = build_pcap_packet_dataframe(path)':
                  'dataframe = build_compact_pcap_packet_dataframe(path)',
              '                low_memory=False,\n            )':
                  '                low_memory=False,\n                memory_map=True,\n            )',
              'return _apply_reference_field_map(dataframe.copy(), metric)':
                  'return _apply_reference_field_map(dataframe, metric)',
              '    work_df = df.copy()':
                  '    work_df = df[[field for field in fields if field in df.columns]].copy()',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cbr_tests/metrics/reference_comparison.py
          git commit -m 'Reduce reference-comparison dataframe copying'
          git push origin HEAD:experiment-finalisation
