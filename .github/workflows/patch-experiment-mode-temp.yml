name: Wire strict experiment mode (temporary)

on:
  push:
    branches:
      - experiment-finalisation
    paths:
      - '.github/workflows/patch-experiment-mode-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-finalisation
      - name: Apply exact runner patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_value, old, new):
              path = Path(path_value)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, found {count}: {old!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'runner/run_plan_helpers.py',
              '    parser.add_argument("--force-output", action="store_true", help="Allow replacement of an existing output file")\n',
              '    parser.add_argument("--force-output", action="store_true", help="Allow replacement of an existing output file")\n'
              '    parser.add_argument(\n'
              '        "--experiment-mode",\n'
              '        action="store_true",\n'
              '        help="Enforce the strict canonical contract required for final experiment runs",\n'
              '    )\n',
          )

          replace_once(
              'run_plan.py',
              'from runner.execution import auto_worker_count, render_live_taxonomy, run_metrics_parallel\n',
              'from runner.execution import auto_worker_count, render_live_taxonomy, run_metrics_parallel\n'
              'from runner.experiment_contract import validate_final_experiment_plan\n',
          )
          replace_once(
              'run_plan.py',
              '    plan = context.plan\n    dataset_path = context.dataset_path\n',
              '    plan = context.plan\n'
              '    experiment_contract_report = (\n'
              '        validate_final_experiment_plan(plan) if getattr(args, "experiment_mode", False) else None\n'
              '    )\n'
              '    dataset_path = context.dataset_path\n',
          )
          replace_once(
              'run_plan.py',
              '    provenance["phase_timings_seconds"] = phase_timings\n\n    base_header_lines = build_base_header_lines',
              '    provenance["phase_timings_seconds"] = phase_timings\n'
              '    if experiment_contract_report is not None:\n'
              '        provenance["experiment_contract"] = experiment_contract_report\n\n'
              '    base_header_lines = build_base_header_lines',
          )

          replace_once(
              'run_batch.py',
              'from runner.batch_state import (\n',
              'from runner.experiment_contract import validate_final_experiment_plan\n'
              'from runner.batch_state import (\n',
          )
          replace_once(
              'run_batch.py',
              '    parser.add_argument(\n        "--force-output",\n',
              '    parser.add_argument(\n'
              '        "--experiment-mode",\n'
              '        action="store_true",\n'
              '        help="Preflight every plan and run each job under the strict final-experiment contract",\n'
              '    )\n'
              '    parser.add_argument(\n        "--force-output",\n',
          )
          replace_once(
              'run_batch.py',
              '    jobs = batch["jobs"]\n    total_jobs = len(jobs)\n\n    output_value =',
              '    jobs = batch["jobs"]\n'
              '    total_jobs = len(jobs)\n\n'
              '    if args.experiment_mode:\n'
              '        validated_plan_paths: set[Path] = set()\n'
              '        for job in jobs:\n'
              '            plan_path = _resolve_repo_path(repo_root, str(job["plan_path"]))\n'
              '            if plan_path in validated_plan_paths:\n'
              '                continue\n'
              '            payload = json.loads(plan_path.read_text(encoding="utf-8"))\n'
              '            validate_final_experiment_plan(payload)\n'
              '            validated_plan_paths.add(plan_path)\n'
              '        print(f"Final experiment contract validated for {len(validated_plan_paths)} plan(s).")\n\n'
              '    output_value =',
          )
          replace_once(
              'run_batch.py',
              '        if args.force_output:\n            command.append("--force-output")\n',
              '        if args.experiment_mode:\n'
              '            command.append("--experiment-mode")\n'
              '        if args.force_output:\n'
              '            command.append("--force-output")\n',
          )
          PY
      - name: Commit runner patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add run_plan.py run_batch.py runner/run_plan_helpers.py
          git commit -m 'Add strict final experiment execution mode'
          git push origin HEAD:experiment-finalisation
