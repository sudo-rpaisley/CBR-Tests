name: Verify canonical IEEE workflow

on:
  push:
    branches:
      - overhaul/metric-conformance

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/metric-conformance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Complete TUI compatibility warnings and README
        run: |
          python - <<'PY'
          from pathlib import Path

          tui = Path('runner/tui.py')
          text = tui.read_text()
          old = 'from cbr_tests.plan_migration import LEGACY_INTRINSIC_METRIC_MIGRATIONS\n'
          new = '''from cbr_tests.plan_migration import (\n    COMPATIBILITY_ONLY_METRIC_PROFILES,\n    LEGACY_INTRINSIC_METRIC_MIGRATIONS,\n)\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'COMPATIBILITY_ONLY_METRIC_PROFILES' not in text:
              raise SystemExit('TUI plan-migration import not found')

          old = '''    if metric_id in LEGACY_INTRINSIC_METRIC_MIGRATIONS:\n        parts.append("id_contract=legacy_compatibility")\n'''
          new = '''    if metric_id in LEGACY_INTRINSIC_METRIC_MIGRATIONS:\n        parts.append("id_contract=legacy_compatibility")\n    elif metric_id in COMPATIBILITY_ONLY_METRIC_PROFILES:\n        parts.append("id_contract=compatibility_profile")\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'id_contract=compatibility_profile' not in text:
              raise SystemExit('TUI metric-contract block not found')

          old = '''        if metric_id in LEGACY_INTRINSIC_METRIC_MIGRATIONS:\n            replacement = LEGACY_INTRINSIC_METRIC_MIGRATIONS[metric_id]["metric_id"]\n            sections["legacy"].append(f"{metric_id} -> {replacement}")\n'''
          new = '''        if metric_id in LEGACY_INTRINSIC_METRIC_MIGRATIONS:\n            replacement = LEGACY_INTRINSIC_METRIC_MIGRATIONS[metric_id]["metric_id"]\n            sections["legacy"].append(f"{metric_id} -> {replacement}")\n        elif metric_id in COMPATIBILITY_ONLY_METRIC_PROFILES:\n            sections["legacy"].append(\n                f"{metric_id} -> regenerate plan: {COMPATIBILITY_ONLY_METRIC_PROFILES[metric_id]}"\n            )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'regenerate plan: {COMPATIBILITY_ONLY_METRIC_PROFILES' not in text:
              raise SystemExit('TUI legacy-section block not found')
          tui.write_text(text)

          tests = Path('tests/test_tui.py')
          t = tests.read_text()
          marker = 'def test_result_sections_flag_compatibility_only_profile'
          if marker not in t:
              t += '''\n\ndef test_result_sections_flag_compatibility_only_profile(tmp_path):\n    output = tmp_path / "compatibility.json"\n    output.write_text(\n        json.dumps({\n            "metric_results": [{"metric_id": "protocol_validity_profile", "status": "success"}],\n            "test_results": {"protocol_validity_profile": {"summary": {"status": "pass"}}},\n        }),\n        encoding="utf-8",\n    )\n    sections = build_result_sections({"dry_run": False, "status": "success", "output_path": str(output), "metrics_total": 1, "skipped_count": 0})\n    legacy = next(section for section in sections if section.title == "Legacy compatibility IDs (1)")\n    assert any("protocol_validity_profile -> regenerate plan" in line for line in legacy.lines)\n    readable = next(section for section in sections if section.title.startswith("Human-readable metric results"))\n    assert any("id_contract=compatibility_profile" in line for line in readable.lines)\n'''
              tests.write_text(t)

          readme = Path('README.md')
          r = readme.read_text()
          r = r.replace(
              'Automatic plans for `.pcap`/`.pcapng` include **21 existing metrics that are currently runnable from raw packet evidence without inventing research configuration**.',
              'Automatic plans for `.pcap`/`.pcapng` include **20 metrics that are currently runnable from raw packet evidence without inventing research configuration**.',
          )
          r = r.replace(
              'These configured additions are deliberately kept separate from the 21 configuration-free automatic metrics so the reported count never implies that research assumptions were inferred automatically.',
              'These configured additions are deliberately kept separate from the 20 configuration-free automatic metrics so the reported count never implies that research assumptions were inferred automatically.',
          )
          r = r.replace(
              'Foundational metrics have moved to `cbr_tests.metrics`. Legacy import modules remain as compatibility shims. Label, slice, reference-comparison, and nested network-realism implementations are still being migrated out of `tests/`; see [Architecture](docs/architecture.md) for the exact boundary.',
              'Canonical production metric implementations now live beneath `cbr_tests/metrics/`. Legacy import modules under `tests/` remain only as compatibility shims where historical imports require them; production dispatch no longer depends on the test package for those metric families. See [Architecture](docs/architecture.md) for the current boundary.',
          )
          readme.write_text(r)
          PY
      - name: Regenerate docs and run full suite
        run: |
          python scripts/build_reference_documentation.py
          python -m compileall -q cbr_tests runner scripts tests
          python -m pytest -q
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner/tui.py tests/test_tui.py README.md docs/function_reference.md docs/test_reference.md
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Clarify canonical PCAP plan and result semantics"
          git push origin HEAD:overhaul/metric-conformance
