name: Classify threshold provenance (overhaul)

on:
  push:
    branches:
      - overhaul/metric-conformance

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/metric-conformance

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Add provenance helpers and annotate remaining policies
        run: |
          python - <<'PY'
          from pathlib import Path

          decision = Path('cbr_tests/metrics/decision_rules.py')
          text = decision.read_text()
          addition = '''

          def resolve_maximum_ratio_failure_rule(
              parameters: dict | None,
              *,
              parameter_name: str,
              default: float,
          ) -> dict:
              """Resolve a one-sided failure cutoff and record its provenance.

              This decision rule is separate from the metric equation. A default
              is framework policy unless an experiment supplies other provenance.
              """
              parameters = parameters or {}
              threshold = float(parameters.get(parameter_name, default))
              if not 0 <= threshold <= 1:
                  raise ValueError(f"{parameter_name} must be between 0 and 1.")
              configured = parameter_name in parameters
              provenance_key = f"{parameter_name}_provenance"
              provenance = str(
                  parameters.get(
                      provenance_key,
                      "scenario-configured" if configured else "framework-default",
                  )
              ).strip() or ("scenario-configured" if configured else "framework-default")
              return {
                  "parameter": parameter_name,
                  "failure_threshold": threshold,
                  "comparison": "observed_ratio > failure_threshold",
                  "provenance": provenance,
                  "source": "metric.calculation.parameters" if configured else "framework default",
                  "scientific_role": "decision_policy_not_metric_definition",
              }


          def describe_measurement_parameter(
              parameters: dict | None,
              *,
              parameter_name: str,
              default,
              value=None,
          ) -> dict:
              """Record provenance for a parameter that changes the measured value."""
              parameters = parameters or {}
              configured = parameter_name in parameters
              provenance_key = f"{parameter_name}_provenance"
              provenance = str(
                  parameters.get(
                      provenance_key,
                      "scenario-configured" if configured else "framework-default",
                  )
              ).strip() or ("scenario-configured" if configured else "framework-default")
              resolved_value = parameters.get(parameter_name, default) if value is None else value
              return {
                  "parameter": parameter_name,
                  "value": resolved_value,
                  "provenance": provenance,
                  "source": "metric.calculation.parameters" if configured else "framework default",
                  "scientific_role": "measurement_operationalisation_parameter",
              }
          '''
          if 'def resolve_maximum_ratio_failure_rule(' not in text:
              # Dedent the embedded helper functions before appending.
              import textwrap
              decision.write_text(text.rstrip() + '\n\n' + textwrap.dedent(addition).strip() + '\n')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label}: target block not found')
              return text.replace(old, new, 1)

          # One-sided failure policy for valid-port checking.
          path = Path('cbr_tests/metrics/protocol_network/port_validity/valid_port_range_profile.py')
          text = path.read_text()
          import_line = 'from cbr_tests.metrics.decision_rules import resolve_maximum_ratio_failure_rule\n'
          if import_line not in text:
              text = replace_once(
                  text,
                  'from runner.tabular import load_tabular_dataset\n',
                  'from runner.tabular import load_tabular_dataset\n' + import_line,
                  'valid-port import',
              )
          text = replace_once(
              text,
              '    invalid_ratio_fail_threshold = float(params.get("invalid_ratio_fail_threshold", 0.01))\n    if valid_min_port < 0 or valid_max_port > 65535 or valid_min_port > valid_max_port:\n',
              '    try:\n        failure_rule = resolve_maximum_ratio_failure_rule(\n            params, parameter_name="invalid_ratio_fail_threshold", default=0.01\n        )\n    except ValueError as exc:\n        return False, {"error": str(exc), "reason_code": "invalid_metric_configuration"}\n    invalid_ratio_fail_threshold = failure_rule["failure_threshold"]\n    if valid_min_port < 0 or valid_max_port > 65535 or valid_min_port > valid_max_port:\n',
              'valid-port threshold',
          )
          text = replace_once(
              text,
              '    if not 0 <= invalid_ratio_fail_threshold <= 1:\n        return False, {\n            "error": "invalid_ratio_fail_threshold must be between 0 and 1.",\n            "reason_code": "invalid_metric_configuration",\n        }\n\n',
              '',
              'valid-port old validation',
          )
          text = replace_once(
              text,
              '                "invalid_ratio_fail_threshold": invalid_ratio_fail_threshold,\n                "range_counts": range_counts,\n',
              '                "invalid_ratio_fail_threshold": invalid_ratio_fail_threshold,\n                "decision_rule": {\n                    **failure_rule,\n                    "warning_policy": "warn_on_any_invalid_or_zero_port_below_failure_threshold",\n                },\n                "normative_domain": {\n                    "port_namespace_min": 0,\n                    "port_namespace_max": 65535,\n                    "scientific_role": "normative_value_domain",\n                },\n                "range_counts": range_counts,\n',
              'valid-port metadata',
          )
          path.write_text(text)

          # Legacy reserved-address profile; canonical misuse ratio remains separate.
          path = Path('cbr_tests/metrics/protocol_network/address_validity/reserved_ip_address_profile.py')
          text = path.read_text()
          if import_line not in text:
              text = replace_once(
                  text,
                  'from runner.tabular import load_tabular_dataset\n',
                  'from runner.tabular import load_tabular_dataset\n' + import_line,
                  'reserved-profile import',
              )
          text = replace_once(
              text,
              '    invalid_ratio_fail_threshold = float(params.get("invalid_ratio_fail_threshold", 0.01))\n    if not 0 <= invalid_ratio_fail_threshold <= 1:\n        return False, {\n            "error": "invalid_ratio_fail_threshold must be between 0 and 1.",\n            "reason_code": "invalid_metric_configuration",\n        }\n',
              '    try:\n        failure_rule = resolve_maximum_ratio_failure_rule(\n            params, parameter_name="invalid_ratio_fail_threshold", default=0.01\n        )\n    except ValueError as exc:\n        return False, {"error": str(exc), "reason_code": "invalid_metric_configuration"}\n    invalid_ratio_fail_threshold = failure_rule["failure_threshold"]\n',
              'reserved-profile threshold',
          )
          text = replace_once(
              text,
              '                "invalid_ratio_fail_threshold": invalid_ratio_fail_threshold,\n                "ip_version_counts": ip_version_counts,\n',
              '                "invalid_ratio_fail_threshold": invalid_ratio_fail_threshold,\n                "decision_rule": {\n                    **failure_rule,\n                    "warning_policy": "warn_on_any_invalid_or_policy-counted_special-use_address_below_failure_threshold",\n                    "compatibility_note": "legacy profile; canonical reserved-address misuse ratio is computed separately",\n                },\n                "ip_version_counts": ip_version_counts,\n',
              'reserved-profile metadata',
          )
          path.write_text(text)

          # Tolerances affect the numerator, so report them as measurement parameters.
          specs = [
              ('cbr_tests/metrics/protocol_network/flow_semantics/flow_duration_consistency_profile.py', 'parameters', [('tolerance', 'tol', '1e-6')], '        "flow_duration_consistency_ratio": ratio,\n'),
              ('cbr_tests/metrics/protocol_network/flow_semantics/packet_byte_consistency_profile.py', 'p', [('tolerance', 'tol', '1e-6'), ('variance_tolerance', 'vtol', '1e-3')], '        "packet_byte_consistency_ratio": ratio,\n'),
              ('cbr_tests/metrics/protocol_network/flow_semantics/derived_rate_consistency_profile.py', 'parameters', [('relative_tolerance', 'relative_tolerance', '0.02'), ('absolute_tolerance', 'absolute_tolerance', '1e-6')], '                "derived_rate_consistency_ratio": ratio,\n'),
          ]
          for filename, params_name, parameters, marker in specs:
              path = Path(filename)
              text = path.read_text()
              old_import = 'from cbr_tests.metrics.decision_rules import classify_ratio, resolve_ratio_decision_rule\n'
              if 'describe_measurement_parameter' not in text:
                  text = replace_once(
                      text,
                      old_import,
                      'from cbr_tests.metrics.decision_rules import (\n    classify_ratio,\n    describe_measurement_parameter,\n    resolve_ratio_decision_rule,\n)\n',
                      f'{path.name} import',
                  )
              entries = []
              for name, variable, default in parameters:
                  entries.append(
                      f'            "{name}": describe_measurement_parameter(\n'
                      f'                {params_name}, parameter_name="{name}", default={default}, value={variable}\n'
                      '            ),'
                  )
              block = marker + '        "measurement_parameters": {\n' + '\n'.join(entries) + '\n        },\n'
              text = replace_once(text, marker, block, f'{path.name} measurement metadata')
              path.write_text(text)
          PY

      - name: Extend provenance tests
        run: |
          cat >> tests/test_decision_rules.py <<'PY'


def test_maximum_ratio_failure_rule_records_provenance():
    from cbr_tests.metrics.decision_rules import resolve_maximum_ratio_failure_rule

    default_rule = resolve_maximum_ratio_failure_rule(
        {}, parameter_name="invalid_ratio_fail_threshold", default=0.01
    )
    assert default_rule["failure_threshold"] == 0.01
    assert default_rule["provenance"] == "framework-default"
    assert default_rule["scientific_role"] == "decision_policy_not_metric_definition"

    configured_rule = resolve_maximum_ratio_failure_rule(
        {
            "invalid_ratio_fail_threshold": 0.05,
            "invalid_ratio_fail_threshold_provenance": "empirically-calibrated",
        },
        parameter_name="invalid_ratio_fail_threshold",
        default=0.01,
    )
    assert configured_rule["failure_threshold"] == 0.05
    assert configured_rule["provenance"] == "empirically-calibrated"


def test_measurement_parameter_records_default_and_configured_provenance():
    from cbr_tests.metrics.decision_rules import describe_measurement_parameter

    default = describe_measurement_parameter(
        {}, parameter_name="tolerance", default=1e-6, value=1e-6
    )
    assert default["provenance"] == "framework-default"
    assert default["scientific_role"] == "measurement_operationalisation_parameter"

    configured = describe_measurement_parameter(
        {"tolerance": 0.01, "tolerance_provenance": "empirically-calibrated"},
        parameter_name="tolerance",
        default=1e-6,
        value=0.01,
    )
    assert configured["provenance"] == "empirically-calibrated"
    assert configured["source"] == "metric.calculation.parameters"
PY

      - name: Regenerate and verify
        run: |
          python scripts/build_reference_documentation.py
          python -m compileall -q cbr_tests runner tests
          python -m pytest -q

      - name: Commit threshold provenance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cbr_tests/metrics tests/test_decision_rules.py docs/function_reference.md docs/test_reference.md
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m "Classify threshold and tolerance provenance"
          git push origin HEAD:overhaul/metric-conformance
