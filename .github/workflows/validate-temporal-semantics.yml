name: Validate temporal semantic corrections

on:
  push:
    branches: [agent/fix-temporal-semantics]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-temporal-semantics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Apply documentation/template patch
        run: python scripts/apply_temporal_semantics_patch.py
      - name: Compile
        run: python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
      - name: Targeted temporal tests
        run: python -m pytest -q tests/test_temporal_metrics_profile.py
      - name: Full suite
        run: python -m pytest -q
      - name: Remove temporary validation files
        run: |
          rm scripts/apply_temporal_semantics_patch.py
          rm .github/workflows/validate-temporal-semantics.yml
      - name: Refresh generated references after cleanup
        run: |
          python scripts/build_reference_documentation.py
          python scripts/build_reference_documentation.py --check
      - name: Commit validated temporal corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix temporal activity and periodicity semantics'
            git push origin HEAD:agent/fix-temporal-semantics
          fi
