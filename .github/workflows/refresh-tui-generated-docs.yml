name: Refresh TUI generated docs

on:
  push:
    branches:
      - tui-usability

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[generated-docs]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tui-usability
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh generated references
        run: python scripts/build_reference_documentation.py
      - name: Commit generated references
        run: |
          if git diff --quiet -- docs/function_reference.md docs/test_reference.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/function_reference.md docs/test_reference.md
          git commit -m "Refresh generated TUI references [generated-docs]"
          git push origin HEAD:tui-usability
