name: Refresh generated documentation

on:
  push:
    branches:
      - overhaul/metric-conformance

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: overhaul/metric-conformance

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate reference documentation
        run: python scripts/build_reference_documentation.py

      - name: Commit generated documentation
        run: |
          if git diff --quiet -- docs/function_reference.md docs/test_reference.md; then
            echo "Generated documentation already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/function_reference.md docs/test_reference.md
          git commit -m "Refresh generated reference documentation"
          git push origin HEAD:overhaul/metric-conformance
