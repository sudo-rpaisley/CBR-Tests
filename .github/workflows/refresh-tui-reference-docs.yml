name: Refresh TUI reference documentation

on:
  push:
    branches:
      - agent/restore-tui
    paths:
      - .github/workflows/refresh-tui-reference-docs.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/restore-tui

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate reference documentation
        run: python scripts/build_reference_documentation.py

      - name: Commit generated references and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-tui-reference-docs.yml
          git add docs/function_reference.md docs/test_reference.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh generated references for restored TUI"
          git push
