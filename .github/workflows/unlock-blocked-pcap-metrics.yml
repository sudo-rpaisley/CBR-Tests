### Optional independent reference PCAP

Reference-comparison tests still require a genuinely independent reference, but the builder can now consume one directly:

```bash
python create_plan.py \
  --name "Candidate against real reference" \
  --dataset datasets/candidate.pcap \
  --reference-dataset datasets/reference-real.pcap
```

Candidate and reference PCAPs are decoded through the same canonical packet representation. This unlocks 12 packet-level reference metrics: feature-wise Wasserstein/KS/energy distance, standardized multivariate RBF MMD, Pearson/Spearman/distance-correlation deviation, inter-arrival/burstiness/hourly-activity deviation, protocol-mix divergence and port-use divergence. Numeric PCAP timestamps use explicit seconds, distance correlation is deterministically bounded, and MMD standardizes pooled features so packet length does not dominate inter-arrival time merely because of units.

The builder rejects candidate/reference self-comparison and does not automatically compare a raw PCAP with a tabular reference because the representations may encode different semantics. Slice-reference metrics remain blocked without slice metadata, and `flow_statistic_deviation_from_reference` remains blocked until a flow-segmentation/exporter policy is explicit.

### Optional service-port profile

A service cannot be inferred from a port and then validated against that same port without circular reasoning. Therefore service-port consistency remains blocked by default on raw captures. If independent experiment knowledge establishes that the **entire capture contains one service**, configure it explicitly:

```bash
python create_plan.py \
  --name "DNS capture" \
  --dataset datasets/dns-only.pcap \
  --single-service dns \
  --expected-service-ports 53
```

The resulting metric uses all packet rows as an explicitly asserted service population. Non-standard ports produce a warning for investigation rather than an automatic realism failure, because legitimate services can run on non-standard ports.

A canonical bidirectional 5-tuple flow view remains available internally for later flow-aware work. It does not assume an exporter idle timeout, so it is not silently treated as equivalent to CICFlowMeter or another exporter.
''',
