def pcap_service_port_template(service_name: str, expected_ports: list[int]) -> dict:
    """Return a conservative packet-view template for an explicitly single-service capture.

    The caller must independently know that the capture population represents the
    named service. Ports are therefore checked against an external assertion rather
    than being used to infer the service and then "validate" that same inference.
    A mismatch produces a warning, not an automatic realism failure, because
    legitimate deployments can use non-standard ports.
    """

    name = str(service_name).strip()
    ports = sorted({int(port) for port in expected_ports})
    if not name:
        raise ValueError("service_name must not be empty")
    if not ports or any(port < 0 or port > 65535 for port in ports):
        raise ValueError("expected service ports must contain integers in 0-65535")
    return {
        "metric_id": "service_port_consistency_profile",
        "label": "Service-Port Consistency Profile",
        "input_requirements": {
            "port_fields": ["Source Port", "Destination Port"],
        },
        "calculation": {
            "method": "pcap_single_service_port_consistency",
            "parameters": {
                "service_name": name,
                "expected_ports": ports,
                "match_mode": "any_port",
                "population_mode": "all_rows",
                "pass_threshold": 1.0,
                "warn_threshold": 0.0,
                "max_examples": 10,
                "population_assumption_source": "explicit_plan_configuration",
            },
        },
    }


