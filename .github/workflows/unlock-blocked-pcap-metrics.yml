name: Unlock blocked PCAP metrics

on:
  push:
    branches:
      - agent/unlock-blocked-pcap-metrics

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unlock-blocked-pcap-metrics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply implementation
        run: python scripts/apply_unlock_blocked_pcap_metrics.py
      - name: Repair generated safeguards
        run: |
          python - <<'PY'
          from pathlib import Path

          create_path = Path("create_plan.py")
          text = create_path.read_text(encoding="utf-8")
          text = text.replace('answer = input("\nAdd an independent reference PCAP', 'answer = input("\\nAdd an independent reference PCAP')
          text = text.replace('answer = input("\nIs the entire capture', 'answer = input("\\nIs the entire capture')
          create_path.write_text(text, encoding="utf-8")

          builder_path = Path("runner/plan_builder.py")
          text = builder_path.read_text(encoding="utf-8")
          old = '''            elif metric_id == "service_port_consistency_profile" and service_port_configuration:
                spec = dict(spec)
                spec["template"] = pcap_service_port_template(
                    service_port_configuration.get("service_name", ""),
                    service_port_configuration.get("expected_ports", []),
                )
'''
          new = '''            elif metric_id == "service_port_consistency_profile":
                # Do not inherit a service definition discovered from another
                # plan/template. Raw-PCAP service identity must be supplied for
                # this capture explicitly to avoid circular or leaked assumptions.
                spec = dict(spec)
                spec["template"] = None
                if service_port_configuration:
                    spec["template"] = pcap_service_port_template(
                        service_port_configuration.get("service_name", ""),
                        service_port_configuration.get("expected_ports", []),
                    )
'''
          if old not in text:
              raise SystemExit("Expected service-template preflight block not found")
          builder_path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validate targeted behaviour
        run: |
          python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
          python -m pytest -q tests/test_pcap_handshake.py tests/test_pcap_adapter.py tests/test_plan_builder.py tests/test_reference_model_comparison_profile.py
      - name: Validate full suite
        run: python -m pytest -q
      - name: Regenerate and verify references
        run: |
          python scripts/build_reference_documentation.py
          python scripts/build_reference_documentation.py --check
      - name: Commit validated implementation
        run: |
          rm .github/workflows/unlock-blocked-pcap-metrics.yml
          rm scripts/apply_unlock_blocked_pcap_metrics.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unlock scientifically safe PCAP handshake and reference metrics"
          git push origin HEAD:agent/unlock-blocked-pcap-metrics
