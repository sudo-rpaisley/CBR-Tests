    k_yy = np.exp(-gamma * squared_distances(reference_z, reference_z))
    k_xy = np.exp(-gamma * squared_distances(current_z, reference_z))
    mmd_squared = float(k_xx.mean() + k_yy.mean() - 2.0 * k_xy.mean())
