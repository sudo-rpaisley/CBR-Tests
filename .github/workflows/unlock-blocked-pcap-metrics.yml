name: Unlock blocked PCAP metrics

on:
  push:
    branches:
      - agent/unlock-blocked-pcap-metrics

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unlock-blocked-pcap-metrics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply implementation
        run: |
          python scripts/apply_unlock_blocked_pcap_metrics.py
          python scripts/apply_unlock_blocked_pcap_metric_fixes.py
      - name: Validate targeted behaviour
        run: |
          python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
          python -m pytest -q tests/test_pcap_handshake.py tests/test_pcap_adapter.py tests/test_plan_builder.py tests/test_reference_model_comparison_profile.py
      - name: Validate full suite
        run: python -m pytest -q
      - name: Regenerate and verify references
        run: |
          python scripts/build_reference_documentation.py
          python scripts/build_reference_documentation.py --check
      - name: Commit validated implementation
        run: |
          rm .github/workflows/unlock-blocked-pcap-metrics.yml
          rm scripts/apply_unlock_blocked_pcap_metrics.py
          rm scripts/apply_unlock_blocked_pcap_metric_fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unlock scientifically safe PCAP handshake and reference metrics"
          git push origin HEAD:agent/unlock-blocked-pcap-metrics
