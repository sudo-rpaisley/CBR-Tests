name: Integrate derived-rate branch

on:
  push:
    branches:
      - agent/derived-rate-consistency

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/derived-rate-consistency
          fetch-depth: 0

      - name: Merge current main and resolve known overlaps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true

          # These two files overlap with the documentation/package refactor.
          # Start from current main and replay only this PR's unique changes.
          git checkout --theirs runner/dispatch.py docs/metric_catalog.md
          git add runner/dispatch.py docs/metric_catalog.md

          python - <<'PY'
          from pathlib import Path

          dispatch = Path('runner/dispatch.py')
          text = dispatch.read_text(encoding='utf-8')
          import_anchor = '''from tests.metrics.dataset_heuristics.protocol_and_network_realism.flow_semantics.flow_duration_consistency_profile import (\n    run_flow_duration_consistency_metric,\n)\n'''
          import_block = '''from tests.metrics.dataset_heuristics.protocol_and_network_realism.flow_semantics.derived_rate_consistency_profile import (\n    run_derived_rate_consistency_metric,\n)\n'''
          if 'derived_rate_consistency_profile import' not in text:
              if import_anchor not in text:
                  raise SystemExit('Could not locate flow-duration import anchor in runner/dispatch.py')
              text = text.replace(import_anchor, import_anchor + import_block, 1)

          register_anchor = '''@register_metric("packet_byte_consistency_profile")\ndef _packet_byte_metric(dataset_path: Path, metric: dict):\n    return run_packet_byte_consistency_metric(dataset_path, metric)\n\n\n'''
          register_block = '''@register_metric("derived_rate_consistency_profile")\ndef _derived_rate_metric(dataset_path: Path, metric: dict):\n    return run_derived_rate_consistency_metric(dataset_path, metric)\n\n\n'''
          if '@register_metric("derived_rate_consistency_profile")' not in text:
              if register_anchor not in text:
                  raise SystemExit('Could not locate packet/byte registration anchor in runner/dispatch.py')
              text = text.replace(register_anchor, register_anchor + register_block, 1)
          dispatch.write_text(text, encoding='utf-8')

          catalog = Path('docs/metric_catalog.md')
          text = catalog.read_text(encoding='utf-8').replace('all **63** metric IDs', 'all **64** metric IDs', 1)
          catalog.write_text(text, encoding='utf-8')

          reference = Path('docs/metric_reference.md')
          text = reference.read_text(encoding='utf-8')
          text = text.replace('supports **63 metric IDs**', 'supports **64 metric IDs**', 1)
          text = text.replace('[Network and flow realism](metrics/network_realism.md) — 9 metrics.', '[Network and flow realism](metrics/network_realism.md) — 10 metrics.', 1)
          reference.write_text(text, encoding='utf-8')

          network = Path('docs/metrics/network_realism.md')
          text = network.read_text(encoding='utf-8')
          section = '''\n## `derived_rate_consistency_profile`\n\nRecomputes packet/s and byte/s from packet counts, byte totals, and flow duration, then compares them with reported rates.\n\n- **Implementation:** Nested modules under `tests/metrics/dataset_heuristics/...` (production implementation awaiting migration)\n- **Supplied-plan usage:** none yet; available to plans.\n- **Inputs:** explicit `field_map` for duration, forward/backward packet and byte totals, plus at least one reported packet/s or byte/s field.\n- **Primary output:** Checked/inconsistent counts, negative/zero-duration violations, rate mismatch counts, bounded examples, consistency ratio and status.\n- **Interpretation:** Thresholds are plan-configurable; the duration unit must be declared explicitly.\n- **Current caveat:** Post-expert-review addition pending second expert review. Exporter semantics, sampling, timeouts and rounding can explain mismatches. See [Derived rate consistency profile](../derived_rate_consistency_profile.md).\n'''
          if '## `derived_rate_consistency_profile`' not in text:
              marker = '\n## `flow_duration_consistency_profile`\n'
              if marker not in text:
                  raise SystemExit('Could not locate network-realism insertion point')
              text = text.replace(marker, section + marker, 1)
          network.write_text(text, encoding='utf-8')
          PY

          python scripts/build_reference_documentation.py

          git rm .github/workflows/integrate-derived-rate.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to integrate."
            exit 0
          fi
          git commit -m "Reconcile derived-rate metric with current main"
          git push origin HEAD:agent/derived-rate-consistency
