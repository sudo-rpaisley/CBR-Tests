name: Standardise ratio decision rules (overhaul)

on:
  push:
    branches:
      - overhaul/metric-conformance

permissions:
  contents: write

jobs:
  standardise:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/metric-conformance

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Add explicit ratio decision policy
        run: |
          cat > cbr_tests/metrics/decision_rules.py <<'PY'
          """Decision-policy helpers kept separate from scientific metric equations."""

          from __future__ import annotations


          def resolve_ratio_decision_rule(
              parameters: dict | None,
              *,
              default_pass: float,
              default_warn: float,
          ) -> dict:
              """Resolve PASS/WARN cutoffs and record their provenance.

              The thresholds classify a measured ratio; they do not define the ratio itself.
              Defaults are framework policy unless an experiment explicitly overrides them.
              """
              parameters = parameters or {}
              pass_threshold = float(parameters.get("pass_threshold", default_pass))
              warn_threshold = float(parameters.get("warn_threshold", default_warn))
              if not 0 <= warn_threshold <= pass_threshold <= 1:
                  raise ValueError(
                      "Ratio decision thresholds must satisfy 0 <= warn_threshold <= pass_threshold <= 1."
                  )

              configured = "pass_threshold" in parameters or "warn_threshold" in parameters
              provenance = str(
                  parameters.get(
                      "threshold_provenance",
                      "scenario-configured" if configured else "framework-default",
                  )
              ).strip() or ("scenario-configured" if configured else "framework-default")

              return {
                  "pass_threshold": pass_threshold,
                  "warn_threshold": warn_threshold,
                  "provenance": provenance,
                  "source": "metric.calculation.parameters" if configured else "framework default",
                  "scientific_role": "decision_policy_not_metric_definition",
              }


          def classify_ratio(value: float | None, decision_rule: dict) -> str:
              """Apply a resolved decision policy to a ratio without redefining the metric."""
              if value is None:
                  return "not_applicable"
              if value >= decision_rule["pass_threshold"]:
                  return "pass"
              if value >= decision_rule["warn_threshold"]:
                  return "warn"
              return "fail"
          PY

          python - <<'PY'
          from pathlib import Path

          files = {
              'flow_duration_consistency_profile.py': (0.99, 0.95),
              'packet_byte_consistency_profile.py': (0.99, 0.95),
              'tcp_flag_consistency_profile.py': (0.99, 0.95),
              'handshake_plausibility_profile.py': (0.95, 0.80),
          }
          root = Path('cbr_tests/metrics/protocol_network/flow_semantics')

          for filename, (pass_default, warn_default) in files.items():
              path = root / filename
              text = path.read_text()
              import_line = 'from cbr_tests.metrics.decision_rules import classify_ratio, resolve_ratio_decision_rule\n'
              if import_line not in text:
                  marker = 'from runner.tabular import load_tabular_dataset\n'
                  if marker not in text:
                      raise SystemExit(f'import marker not found in {filename}')
                  text = text.replace(marker, marker + import_line, 1)

              if filename == 'flow_duration_consistency_profile.py':
                  old = '''    tol = float(metric.get("calculation", {}).get("parameters", {}).get("tolerance", 1e-6))\n    max_examples = int(metric.get("calculation", {}).get("parameters", {}).get("max_examples", 10))\n'''
                  new = f'''    parameters = metric.get("calculation", {{}}).get("parameters", {{}})\n    tol = float(parameters.get("tolerance", 1e-6))\n    max_examples = int(parameters.get("max_examples", 10))\n    try:\n        decision_rule = resolve_ratio_decision_rule(\n            parameters, default_pass={pass_default}, default_warn={warn_default}\n        )\n    except ValueError as exc:\n        return False, {{"error": str(exc), "reason_code": "invalid_metric_configuration"}}\n'''
                  if old not in text:
                      raise SystemExit('flow-duration parameter block not found')
                  text = text.replace(old, new, 1)
                  old = '''    ratio = round(consistent_row_count / checked_row_count, 6) if checked_row_count else 0.0\n    status = "pass" if ratio >= 0.99 else "warn" if ratio >= 0.95 else "fail"\n'''
              elif filename == 'packet_byte_consistency_profile.py':
                  old = '''    p = metric.get("calculation", {}).get("parameters", {})\n    tol = float(p.get("tolerance", 1e-6))\n    vtol = float(p.get("variance_tolerance", 1e-3))\n    max_examples = int(p.get("max_examples", 10))\n'''
                  new = f'''    p = metric.get("calculation", {{}}).get("parameters", {{}})\n    tol = float(p.get("tolerance", 1e-6))\n    vtol = float(p.get("variance_tolerance", 1e-3))\n    max_examples = int(p.get("max_examples", 10))\n    try:\n        decision_rule = resolve_ratio_decision_rule(\n            p, default_pass={pass_default}, default_warn={warn_default}\n        )\n    except ValueError as exc:\n        return False, {{"error": str(exc), "reason_code": "invalid_metric_configuration"}}\n'''
                  if old not in text:
                      raise SystemExit('packet-byte parameter block not found')
                  text = text.replace(old, new, 1)
                  old = '''    ratio = round(consistent_row_count / checked_row_count, 6) if checked_row_count else 0.0\n    status = "pass" if ratio >= 0.99 else "warn" if ratio >= 0.95 else "fail"\n'''
              elif filename == 'tcp_flag_consistency_profile.py':
                  old = '''    params = metric.get("calculation", {}).get("parameters", {})\n    tcp_vals = {str(v).lower() for v in params.get("tcp_protocol_values", [6, "6", "TCP", "tcp"])}\n    non_tcp_zero = bool(params.get("non_tcp_flags_must_be_zero", True))\n    max_examples = int(params.get("max_examples", 10))\n'''
                  new = f'''    params = metric.get("calculation", {{}}).get("parameters", {{}})\n    tcp_vals = {{str(v).lower() for v in params.get("tcp_protocol_values", [6, "6", "TCP", "tcp"])}}\n    non_tcp_zero = bool(params.get("non_tcp_flags_must_be_zero", True))\n    max_examples = int(params.get("max_examples", 10))\n    try:\n        decision_rule = resolve_ratio_decision_rule(\n            params, default_pass={pass_default}, default_warn={warn_default}\n        )\n    except ValueError as exc:\n        return False, {{"error": str(exc), "reason_code": "invalid_metric_configuration"}}\n'''
                  if old not in text:
                      raise SystemExit('tcp-flag parameter block not found')
                  text = text.replace(old, new, 1)
                  old = '''    ratio = round(consistent_row_count / checked_row_count, 6)\n    status = "pass" if ratio >= 0.99 else "warn" if ratio >= 0.95 else "fail"\n'''
              else:
                  old = '''    p=metric.get("calculation",{}).get("parameters",{})\n    tcp_vals={str(v).lower() for v in p.get("tcp_protocol_values",[6,"6","TCP","tcp"]) }\n    allow_syn_only=bool(p.get("allow_syn_only",False)); allow_rst=bool(p.get("allow_rst_flows",True)); max_examples=int(p.get("max_examples",10))\n'''
                  new = f'''    p=metric.get("calculation",{{}}).get("parameters",{{}})\n    tcp_vals={{str(v).lower() for v in p.get("tcp_protocol_values",[6,"6","TCP","tcp"]) }}\n    allow_syn_only=bool(p.get("allow_syn_only",False)); allow_rst=bool(p.get("allow_rst_flows",True)); max_examples=int(p.get("max_examples",10))\n    try:\n        decision_rule = resolve_ratio_decision_rule(\n            p, default_pass={pass_default}, default_warn={warn_default}\n        )\n    except ValueError as exc:\n        return False, {{"error": str(exc), "reason_code": "invalid_metric_configuration"}}\n'''
                  if old not in text:
                      raise SystemExit('handshake parameter block not found')
                  text = text.replace(old, new, 1)
                  text = text.replace('"handshake_plausibility_ratio":0.0,"examples":[],"status":"not_applicable"', '"handshake_plausibility_ratio":None,"examples":[],"decision_rule":decision_rule,"status":"not_applicable"', 1)
                  old = '''    ratio=round(plaus/checked,6) if checked else 0.0\n    status="pass" if ratio>=0.95 else "warn" if ratio>=0.80 else "fail"\n'''

              new = '''    ratio = round(consistent_row_count / checked_row_count, 6) if checked_row_count else None\n    status = classify_ratio(ratio, decision_rule)\n''' if filename != 'handshake_plausibility_profile.py' else '''    ratio=round(plaus/checked,6) if checked else None\n    status=classify_ratio(ratio, decision_rule)\n'''
              if old not in text:
                  raise SystemExit(f'ratio/status block not found in {filename}')
              text = text.replace(old, new, 1)

              if filename == 'tcp_flag_consistency_profile.py':
                  old_zero = '''    if checked_row_count == 0:\n        return False, {"error": "No rows could be checked for tcp_flag_consistency_profile."}\n\n'''
                  if old_zero not in text:
                      raise SystemExit('tcp flag zero-population block not found')
                  text = text.replace(old_zero, '', 1)

              if filename != 'handshake_plausibility_profile.py':
                  marker = '        "examples": examples,\n        "status": status\n'
                  if marker not in text:
                      raise SystemExit(f'result marker not found in {filename}')
                  text = text.replace(marker, '        "examples": examples,\n        "decision_rule": decision_rule,\n        "status": status\n', 1)
              else:
                  marker = '"handshake_plausibility_ratio":ratio,"examples":examples[:max_examples],"status":status'
                  if marker not in text:
                      raise SystemExit('handshake result marker not found')
                  text = text.replace(marker, '"handshake_plausibility_ratio":ratio,"examples":examples[:max_examples],"decision_rule":decision_rule,"status":status', 1)

              path.write_text(text)
          PY

          cat > tests/test_decision_rules.py <<'PY'
          import pytest

          from cbr_tests.metrics.decision_rules import classify_ratio, resolve_ratio_decision_rule


          def test_ratio_decision_rule_marks_unoverridden_cutoffs_as_framework_defaults():
              rule = resolve_ratio_decision_rule({}, default_pass=0.99, default_warn=0.95)
              assert rule["pass_threshold"] == 0.99
              assert rule["warn_threshold"] == 0.95
              assert rule["provenance"] == "framework-default"
              assert rule["scientific_role"] == "decision_policy_not_metric_definition"


          def test_ratio_decision_rule_marks_threshold_overrides_as_scenario_configured():
              rule = resolve_ratio_decision_rule(
                  {"pass_threshold": 0.9, "warn_threshold": 0.8},
                  default_pass=0.99,
                  default_warn=0.95,
              )
              assert rule["provenance"] == "scenario-configured"
              assert classify_ratio(0.95, rule) == "pass"
              assert classify_ratio(0.85, rule) == "warn"
              assert classify_ratio(0.5, rule) == "fail"


          def test_ratio_decision_rule_allows_explicit_provenance_label():
              rule = resolve_ratio_decision_rule(
                  {
                      "pass_threshold": 0.9,
                      "warn_threshold": 0.8,
                      "threshold_provenance": "empirically-calibrated",
                  },
                  default_pass=0.99,
                  default_warn=0.95,
              )
              assert rule["provenance"] == "empirically-calibrated"


          def test_ratio_decision_rule_rejects_invalid_ordering():
              with pytest.raises(ValueError):
                  resolve_ratio_decision_rule(
                      {"pass_threshold": 0.8, "warn_threshold": 0.9},
                      default_pass=0.99,
                      default_warn=0.95,
                  )


          def test_none_ratio_is_not_applicable_not_failure():
              rule = resolve_ratio_decision_rule({}, default_pass=0.99, default_warn=0.95)
              assert classify_ratio(None, rule) == "not_applicable"
          PY

      - name: Regenerate and verify
        run: |
          python scripts/build_reference_documentation.py
          python -m compileall -q cbr_tests runner tests
          python -m pytest -q

      - name: Commit decision-policy separation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cbr_tests/metrics/decision_rules.py cbr_tests/metrics/protocol_network/flow_semantics tests/test_decision_rules.py docs/function_reference.md docs/test_reference.md
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m "Separate ratio metrics from verdict threshold policy"
          git push origin HEAD:overhaul/metric-conformance
