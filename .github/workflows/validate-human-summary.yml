name: Validate human-readable outcome summaries

on:
  push:
    branches:
      - agent/human-readable-outcome-summary

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/human-readable-outcome-summary
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
      - name: Run targeted summary tests
        run: python -m pytest -q tests/test_human_summary.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Rebuild generated reference documentation
        run: python scripts/build_reference_documentation.py
      - name: Verify generated reference documentation
        run: python scripts/build_reference_documentation.py --check
      - name: Commit validated generated docs and remove temporary workflow
        run: |
          rm .github/workflows/validate-human-summary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/function_reference.md docs/test_reference.md .github/workflows/validate-human-summary.yml
          git commit -m "Refresh references for human-readable outcome summaries"
          git push
