name: Apply all runnable PCAP metrics

on:
  push:
    branches:
      - agent/pcap-all-runnable-metrics

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pcap-all-runnable-metrics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply PCAP metric expansion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected snippet not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # runner/pcap_adapter.py
          p = Path('runner/pcap_adapter.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('from dataclasses import dataclass, field\n', 'from copy import deepcopy\nfrom dataclasses import dataclass, field\n', 1)
          old = '''# Existing metrics that can consume fields copied directly from packet records.\n# These checks are independent of the flow reconstruction calculations below.\nPCAP_PACKET_METRICS = {\n    "reserved_ip_address_profile",\n    "valid_port_range_profile",\n}\n\nPCAP_SUPPORTED_METRICS = PCAP_DIRECT_METRICS | PCAP_PACKET_METRICS\n'''
          new = '''# Existing metrics that can consume the canonical decoded-packet view without\n# requiring dataset-specific research assumptions.  These are grouped by the\n# question they ask so automatic PCAP planning can expose every currently safe\n# runnable metric rather than an arbitrary shortlist.\nPCAP_PACKET_NETWORK_METRICS = {\n    "reserved_ip_address_profile",\n    "valid_port_range_profile",\n}\n\nPCAP_PACKET_DATA_QUALITY_METRICS = {\n    "column_quality_profile",\n    "missing_value_ratio",\n    "duplicate_row_ratio",\n}\n\nPCAP_PACKET_DEPENDENCY_METRICS = {\n    "pearson_correlation_profile",\n    "spearman_correlation_matrix_deviation",\n    "distance_correlation_matrix_deviation",\n}\n\nPCAP_PACKET_DISTRIBUTION_METRICS = {\n    "kolmogorov_smirnov_feature_divergence",\n    "wasserstein_feature_distance",\n    "energy_distance",\n    "maximum_mean_discrepancy",\n}\n\nPCAP_PACKET_TEMPORAL_METRICS = {\n    "timestamp_parse_success_ratio",\n    "inter_arrival_time_distribution_divergence",\n    "burstiness_coefficient_deviation",\n    "hourly_activity_distribution_divergence",\n    "diurnal_pattern_similarity_score",\n    "periodicity_preservation_score",\n}\n\nPCAP_PACKET_METRICS = (\n    PCAP_PACKET_NETWORK_METRICS\n    | PCAP_PACKET_DATA_QUALITY_METRICS\n    | PCAP_PACKET_DEPENDENCY_METRICS\n    | PCAP_PACKET_DISTRIBUTION_METRICS\n    | PCAP_PACKET_TEMPORAL_METRICS\n)\n\nPCAP_SUPPORTED_METRICS = PCAP_DIRECT_METRICS | PCAP_PACKET_METRICS\n'''
          if old not in text:
              raise SystemExit('PCAP metric set block not found')
          text = text.replace(old, new, 1)
          text = text.replace('    "TCP Flags",\n}', '    "TCP Flags",\n    "Inter Arrival Time",\n}', 1)
          text = text.replace('''PCAP_SELF_DERIVED_METRICS = {\n    "tcp_flag_consistency_profile",\n    "flow_duration_consistency_profile",\n    "packet_byte_consistency_profile",\n    "derived_rate_consistency_profile",\n}\n''', '''PCAP_SELF_DERIVED_METRICS = {\n    "tcp_flag_consistency_profile",\n    "flow_duration_consistency_profile",\n    "packet_byte_consistency_profile",\n    "derived_rate_consistency_profile",\n    "start_end_timestamp_consistency_ratio",\n    "non_negative_duration_ratio",\n}\n\n# These metrics could consume reconstructed information, but their scientific\n# interpretation depends on capture-boundary or experiment context that must be\n# supplied explicitly rather than guessed by the automatic planner.\nPCAP_CONTEXT_CONFIGURATION_REASONS = {\n    "handshake_plausibility_profile": "capture_boundary_policy_required",\n}\n''', 1)
          old = '''    rows: list[dict[str, Any]] = []\n    with PcapReader(str(path)) as reader:\n        for packet_index, packet in enumerate(reader):\n            fields = _packet_fields(packet)\n            if fields is None:\n                continue\n            rows.append({"Packet Index": packet_index, **fields})\n\n    return pd.DataFrame(rows, columns=sorted(PCAP_PACKET_COLUMNS))\n'''
          new = '''    rows: list[dict[str, Any]] = []\n    previous_timestamp: float | None = None\n    with PcapReader(str(path)) as reader:\n        for packet_index, packet in enumerate(reader):\n            fields = _packet_fields(packet)\n            if fields is None:\n                continue\n            timestamp = float(fields["Timestamp"])\n            inter_arrival_time = (\n                None if previous_timestamp is None else timestamp - previous_timestamp\n            )\n            previous_timestamp = timestamp\n            rows.append(\n                {\n                    "Packet Index": packet_index,\n                    **fields,\n                    "Inter Arrival Time": inter_arrival_time,\n                }\n            )\n\n    return pd.DataFrame(rows, columns=sorted(PCAP_PACKET_COLUMNS))\n'''
          if old not in text:
              raise SystemExit('PCAP dataframe construction block not found')
          text = text.replace(old, new, 1)
          start = text.index('def pcap_metric_template(metric_id: str) -> dict | None:')
          new_tail = '''def pcap_metric_template(metric_id: str) -> dict | None:\n    """Return a deterministic template for a metric safe on decoded packet evidence.\n\n    The templates deliberately avoid dataset-specific policy such as service\n    definitions, allowed slice IDs, reference datasets, attack windows, or model\n    configuration.  Numeric dependency/drift metrics use packet length and\n    capture-order inter-arrival time because those quantities have meaningful\n    continuous scales; TCP flag bitmasks and port identifiers are not treated as\n    ordinal measurements for correlation.\n    """\n\n    numeric_analysis_fields = ["Packet Length", "Inter Arrival Time"]\n    templates = {\n        "reserved_ip_address_profile": {\n            "metric_id": "reserved_ip_address_profile",\n            "label": "Reserved/Special-Use IP Address Profile",\n            "input_requirements": {\n                "candidate_fields": ["Source IP", "Destination IP"],\n            },\n            "calculation": {\n                "method": "Profile decoded source/destination IP address categories and apply only explicitly configured special-use policy categories.",\n                "parameters": {\n                    "invalid_ratio_fail_threshold": 0.01,\n                },\n            },\n        },\n        "valid_port_range_profile": {\n            "metric_id": "valid_port_range_profile",\n            "label": "Valid Port Range Profile",\n            "input_requirements": {\n                "candidate_fields": ["Source Port", "Destination Port"],\n            },\n            "calculation": {\n                "method": "Validate decoded TCP/UDP source and destination ports against the configured integer port range.",\n                "parameters": {\n                    "valid_min_port": 0,\n                    "valid_max_port": 65535,\n                    "invalid_ratio_fail_threshold": 0.01,\n                },\n            },\n        },\n        "column_quality_profile": {\n            "metric_id": "column_quality_profile",\n            "label": "Canonical Packet Numeric Field Profile",\n            "input_requirements": {\n                "candidate_fields": [\n                    "Packet Length",\n                    "Inter Arrival Time",\n                    "Source Port",\n                    "Destination Port",\n                    "TCP Flags",\n                ],\n            },\n            "calculation": {\n                "method": "Profile numeric usability of canonical packet fields; missing transport fields are protocol-conditional and descriptive rather than automatically unrealistic.",\n                "parameters": {},\n            },\n        },\n        "missing_value_ratio": {\n            "metric_id": "missing_value_ratio",\n            "label": "Canonical Packet Field Missingness",\n            "input_requirements": {\n                "candidate_fields": [\n                    "Timestamp",\n                    "Source IP",\n                    "Destination IP",\n                    "Source Port",\n                    "Destination Port",\n                    "Protocol",\n                    "IP Version",\n                    "Packet Length",\n                    "TCP Flags",\n                    "Inter Arrival Time",\n                ],\n            },\n            "calculation": {\n                "method": "Profile missingness in canonical packet fields; port/TCP-flag absence is protocol-conditional and the first inter-arrival value is expected to be missing.",\n                "parameters": {},\n            },\n        },\n        "duplicate_row_ratio": {\n            "metric_id": "duplicate_row_ratio",\n            "label": "Repeated Packet-Signature Ratio",\n            "input_requirements": {\n                "subset_fields": [\n                    "Source IP",\n                    "Destination IP",\n                    "Source Port",\n                    "Destination Port",\n                    "Protocol",\n                    "IP Version",\n                    "Packet Length",\n                    "TCP Flags",\n                ],\n            },\n            "calculation": {\n                "method": "Measure repeated canonical packet signatures while excluding capture index and timestamp; repeats are descriptive because retransmissions and repeated requests may be legitimate.",\n                "parameters": {},\n            },\n        },\n        "pearson_correlation_profile": {\n            "metric_id": "pearson_correlation_profile",\n            "label": "Packet Length/IAT Pearson Profile",\n            "input_requirements": {\n                "candidate_fields": numeric_analysis_fields,\n                "minimum_runnable_fields": 2,\n            },\n            "calculation": {\n                "method": "Compute Pearson dependence between packet length and capture-order inter-arrival time.",\n                "parameters": {},\n            },\n        },\n        "spearman_correlation_matrix_deviation": {\n            "metric_id": "spearman_correlation_matrix_deviation",\n            "label": "Packet Length/IAT Spearman Profile",\n            "input_requirements": {\n                "candidate_fields": numeric_analysis_fields,\n                "minimum_runnable_fields": 2,\n            },\n            "calculation": {\n                "method": "Compute Spearman rank dependence between packet length and capture-order inter-arrival time.",\n                "parameters": {},\n            },\n        },\n        "distance_correlation_matrix_deviation": {\n            "metric_id": "distance_correlation_matrix_deviation",\n            "label": "Packet Length/IAT Distance-Correlation Profile",\n            "input_requirements": {\n                "candidate_fields": numeric_analysis_fields,\n                "minimum_runnable_fields": 2,\n            },\n            "calculation": {\n                "method": "Compute nonlinear distance correlation between packet length and capture-order inter-arrival time using a deterministic evenly spaced computational sample when necessary.",\n                "parameters": {\n                    "max_sample_size": 1000,\n                },\n            },\n        },\n        "kolmogorov_smirnov_feature_divergence": {\n            "metric_id": "kolmogorov_smirnov_feature_divergence",\n            "label": "Packet Feature KS Internal Drift",\n            "input_requirements": {"candidate_fields": numeric_analysis_fields},\n            "calculation": {\n                "method": "Compare first- and second-half packet-length and inter-arrival distributions with the two-sample KS statistic.",\n                "parameters": {"minimum_sample_size": 2, "max_sample_size": 1000},\n            },\n        },\n        "wasserstein_feature_distance": {\n            "metric_id": "wasserstein_feature_distance",\n            "label": "Packet Feature Wasserstein Internal Drift",\n            "input_requirements": {"candidate_fields": numeric_analysis_fields},\n            "calculation": {\n                "method": "Compare first- and second-half packet-length and inter-arrival distributions with one-dimensional Wasserstein distance.",\n                "parameters": {"minimum_sample_size": 2, "max_sample_size": 1000},\n            },\n        },\n        "energy_distance": {\n            "metric_id": "energy_distance",\n            "label": "Packet Feature Energy-Distance Internal Drift",\n            "input_requirements": {"candidate_fields": numeric_analysis_fields},\n            "calculation": {\n                "method": "Compare first- and second-half packet-length and inter-arrival distributions with the implemented energy-distance expression.",\n                "parameters": {"minimum_sample_size": 2, "max_sample_size": 1000},\n            },\n        },\n        "maximum_mean_discrepancy": {\n            "metric_id": "maximum_mean_discrepancy",\n            "label": "Packet Feature MMD Internal Drift",\n            "input_requirements": {"candidate_fields": numeric_analysis_fields},\n            "calculation": {\n                "method": "Compare first- and second-half packet-length and inter-arrival distributions with RBF-kernel squared MMD.",\n                "parameters": {"minimum_sample_size": 2, "max_sample_size": 1000},\n            },\n        },\n        "timestamp_parse_success_ratio": {\n            "metric_id": "timestamp_parse_success_ratio",\n            "label": "Packet Timestamp Parse Success Ratio",\n            "input_requirements": {"timestamp_field": "Timestamp"},\n            "calculation": {\n                "method": "Parse PCAP epoch timestamps explicitly as seconds since the Unix epoch.",\n                "parameters": {"timestamp_unit": "s"},\n            },\n        },\n        "inter_arrival_time_distribution_divergence": {\n            "metric_id": "inter_arrival_time_distribution_divergence",\n            "label": "Packet Inter-Arrival Internal Divergence",\n            "input_requirements": {"timestamp_field": "Timestamp"},\n            "calculation": {\n                "method": "Compare first- and second-half packet inter-arrival distributions using decoded PCAP timestamps.",\n                "parameters": {"timestamp_unit": "s", "minimum_sample_size": 2},\n            },\n        },\n        "burstiness_coefficient_deviation": {\n            "metric_id": "burstiness_coefficient_deviation",\n            "label": "Packet Burstiness Coefficient Deviation",\n            "input_requirements": {"timestamp_field": "Timestamp"},\n            "calculation": {\n                "method": "Compare burstiness coefficients of first- and second-half packet inter-arrival gaps.",\n                "parameters": {"timestamp_unit": "s"},\n            },\n        },\n        "hourly_activity_distribution_divergence": {\n            "metric_id": "hourly_activity_distribution_divergence",\n            "label": "Packet Hourly Activity Divergence",\n            "input_requirements": {"timestamp_field": "Timestamp"},\n            "calculation": {\n                "method": "Compare first- and second-half UTC hourly packet activity distributions.",\n                "parameters": {"timestamp_unit": "s"},\n            },\n        },\n        "diurnal_pattern_similarity_score": {\n            "metric_id": "diurnal_pattern_similarity_score",\n            "label": "Packet Diurnal Pattern Similarity",\n            "input_requirements": {"timestamp_field": "Timestamp"},\n            "calculation": {\n                "method": "Compare first- and second-half UTC hourly packet-count shapes using cosine similarity.",\n                "parameters": {"timestamp_unit": "s"},\n            },\n        },\n        "periodicity_preservation_score": {\n            "metric_id": "periodicity_preservation_score",\n            "label": "Packet Periodicity Preservation Score",\n            "input_requirements": {"timestamp_field": "Timestamp"},\n            "calculation": {\n                "method": "Compare autocorrelation of first- and second-half UTC hourly packet counts at configured lags.",\n                "parameters": {"timestamp_unit": "s", "lags": [1, 24]},\n            },\n        },\n    }\n    template = templates.get(metric_id)\n    return None if template is None else deepcopy(template)\n'''
          text = text[:start] + new_tail
          p.write_text(text, encoding='utf-8')

          # cbr_tests/metrics/temporal.py: explicitly support numeric epoch units.
          p = Path('cbr_tests/metrics/temporal.py')
          text = p.read_text(encoding='utf-8')
          old = '''def _parse_timestamp_series(df: pd.DataFrame, field: str) -> pd.Series:\n    if field not in df.columns:\n        return pd.Series([pd.NaT] * len(df), index=df.index)\n    return pd.to_datetime(df[field], errors="coerce", utc=True)\n'''
          new = '''def _timestamp_unit(metric: dict) -> str | None:\n    unit = metric.get("calculation", {}).get("parameters", {}).get("timestamp_unit")\n    if unit is None:\n        return None\n    unit = str(unit).strip().lower()\n    if unit not in {"s", "ms", "us", "ns"}:\n        raise ValueError("timestamp_unit must be one of: s, ms, us, ns")\n    return unit\n\n\ndef _parse_timestamp_series(\n    df: pd.DataFrame,\n    field: str,\n    unit: str | None = None,\n) -> pd.Series:\n    if field not in df.columns:\n        return pd.Series([pd.NaT] * len(df), index=df.index)\n    if unit is not None:\n        return pd.to_datetime(df[field], errors="coerce", utc=True, unit=unit)\n    return pd.to_datetime(df[field], errors="coerce", utc=True)\n'''
          if old not in text:
              raise SystemExit('Temporal parser block not found')
          text = text.replace(old, new, 1)
          text = text.replace('timestamps = _parse_timestamp_series(df, field)', 'timestamps = _parse_timestamp_series(df, field, _timestamp_unit(metric))', 1)
          text = text.replace('_parse_timestamp_series(df, _timestamp_field(metric))', '_parse_timestamp_series(df, _timestamp_field(metric), _timestamp_unit(metric))')
          p.write_text(text, encoding='utf-8')

          # runner/dispatch.py: bound exact distance-correlation work for large PCAPs.
          p = Path('runner/dispatch.py')
          text = p.read_text(encoding='utf-8')
          old = '''    df = shared_df.copy() if shared_df is not None else load_tabular_dataset(dataset_path)\n    candidate_fields = metric["input_requirements"]["candidate_fields"]\n    minimum_runnable_fields = metric["input_requirements"].get(\n        "minimum_runnable_fields", 2\n    )\n    result = compute_distance_correlation_profile(df, candidate_fields)\n'''
          new = '''    df = shared_df.copy() if shared_df is not None else load_tabular_dataset(dataset_path)\n    candidate_fields = metric["input_requirements"]["candidate_fields"]\n    minimum_runnable_fields = metric["input_requirements"].get(\n        "minimum_runnable_fields", 2\n    )\n    parameters = metric.get("calculation", {}).get("parameters", {})\n    max_sample_size = parameters.get("max_sample_size")\n    sampling = None\n    if max_sample_size is not None:\n        max_sample_size = int(max_sample_size)\n        if max_sample_size < 2:\n            return False, {\n                "error": "max_sample_size must be at least 2 for distance correlation.",\n                "reason_code": "invalid_metric_configuration",\n            }\n        if len(df) > max_sample_size:\n            original_row_count = len(df)\n            step = (original_row_count - 1) / (max_sample_size - 1)\n            positions = [round(index * step) for index in range(max_sample_size)]\n            df = df.iloc[positions].copy()\n            sampling = {\n                "method": "deterministic_evenly_spaced_rows",\n                "original_row_count": original_row_count,\n                "sampled_row_count": len(df),\n                "max_sample_size": max_sample_size,\n            }\n    result = compute_distance_correlation_profile(df, candidate_fields)\n'''
          if old not in text:
              raise SystemExit('Distance-correlation runner block not found')
          text = text.replace(old, new, 1)
          old = '''    return True, {\n        "column_validation": result["column_validation"],\n        "test_results": {\n            "distance_correlation_matrix_deviation": result["profile"]\n        },\n    }\n'''
          new = '''    payload = {\n        "column_validation": result["column_validation"],\n        "test_results": {\n            "distance_correlation_matrix_deviation": result["profile"]\n        },\n    }\n    if sampling is not None:\n        payload["sampling"] = sampling\n    return True, payload\n'''
          if old not in text:
              raise SystemExit('Distance-correlation return block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # runner/plan_builder.py: expose capture-context blockers distinctly.
          p = Path('runner/plan_builder.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('''from runner.pcap_adapter import (\n    PCAP_DIRECT_METRICS,\n''', '''from runner.pcap_adapter import (\n    PCAP_CONTEXT_CONFIGURATION_REASONS,\n    PCAP_DIRECT_METRICS,\n''', 1)
          old = '''    if is_pcap:\n        if metric_id in PCAP_DIRECT_METRICS:\n            return "ready", None, []\n        if metric_id in PCAP_SELF_DERIVED_METRICS:\n'''
          new = '''    if is_pcap:\n        if metric_id in PCAP_DIRECT_METRICS:\n            return "ready", None, []\n        context_reason = PCAP_CONTEXT_CONFIGURATION_REASONS.get(metric_id)\n        if context_reason:\n            return "needs_configuration", context_reason, []\n        if metric_id in PCAP_SELF_DERIVED_METRICS:\n'''
          if old not in text:
              raise SystemExit('PCAP preflight block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # Existing narrow adapter test should remain a subset assertion.
          replace_once(
              'tests/test_pcap_adapter.py',
              '    assert set(runners) == PCAP_PACKET_METRICS\n',
              '    assert set(runners).issubset(PCAP_PACKET_METRICS)\n',
          )

          # Add comprehensive execution/preflight regression tests.
          Path('tests/test_pcap_all_runnable_metrics.py').write_text(r'''from pathlib import Path\n\nimport pytest\nfrom scapy.layers.inet import IP, TCP, UDP\nfrom scapy.packet import Raw\nfrom scapy.utils import wrpcap\n\nfrom runner.dispatch import build_metric_handlers\nfrom runner.pcap_adapter import (\n    PCAP_CONTEXT_CONFIGURATION_REASONS,\n    PCAP_DIRECT_METRICS,\n    PCAP_PACKET_METRICS,\n    PCAP_SELF_DERIVED_METRICS,\n    PCAP_SUPPORTED_METRICS,\n    build_pcap_packet_dataframe,\n    pcap_metric_template,\n)\nfrom runner.plan_builder import build_plan\n\n\ndef _write_capture(path: Path, packet_count: int = 64) -> None:\n    packets = []\n    base = 1_700_000_000.0\n    for index in range(packet_count):\n        if index % 4 == 3:\n            packet = (\n                IP(src=f"10.0.1.{(index % 20) + 1}", dst="8.8.8.8")\n                / UDP(sport=50000 + (index % 1000), dport=53)\n                / Raw(b"d" * (20 + index % 11))\n            )\n        else:\n            flags = "S" if index % 8 == 0 else "A"\n            packet = (\n                IP(src="10.0.0.1", dst="10.0.0.2")\n                / TCP(sport=12000 + (index % 17), dport=443, flags=flags)\n                / Raw(b"x" * (40 + index % 23))\n            )\n        packet.time = base + index * (0.05 + (index % 5) * 0.01)\n        packets.append(packet)\n    wrpcap(str(path), packets)\n\n\ndef test_pcap_supported_set_contains_every_current_automatic_packet_metric():\n    assert PCAP_SUPPORTED_METRICS == PCAP_DIRECT_METRICS | PCAP_PACKET_METRICS\n    assert len(PCAP_DIRECT_METRICS) == 2\n    assert len(PCAP_PACKET_METRICS) == 18\n    assert len(PCAP_SUPPORTED_METRICS) == 20\n\n\ndef test_all_packet_view_metrics_execute_on_one_shared_capture(tmp_path):\n    capture = tmp_path / "all-metrics.pcap"\n    _write_capture(capture)\n    dataframe = build_pcap_packet_dataframe(capture)\n\n    assert "Inter Arrival Time" in dataframe.columns\n    assert dataframe.iloc[0]["Inter Arrival Time"] != dataframe.iloc[0]["Inter Arrival Time"]\n    assert dataframe.iloc[1]["Inter Arrival Time"] > 0\n\n    def forbidden_loader(_path):\n        raise AssertionError("PCAP packet-view metric attempted to reload the capture as tabular data")\n\n    handlers = build_metric_handlers(dataframe, forbidden_loader, {})\n    for metric_id in sorted(PCAP_PACKET_METRICS):\n        metric = pcap_metric_template(metric_id)\n        assert metric is not None, metric_id\n        ok, payload = handlers[metric_id](capture, metric)\n        assert ok is True, (metric_id, payload)\n        assert metric_id in payload["test_results"], (metric_id, payload)\n\n    parse_metric = pcap_metric_template("timestamp_parse_success_ratio")\n    ok, payload = handlers["timestamp_parse_success_ratio"](capture, parse_metric)\n    assert ok is True\n    summary = payload["test_results"]["timestamp_parse_success_ratio"]["summary"]\n    assert summary["timestamp_parse_success_ratio"] == 1.0\n\n\ndef test_automatic_pcap_plan_contains_all_twenty_currently_runnable_metrics(tmp_path):\n    capture = tmp_path / "capture.pcap"\n    _write_capture(capture)\n\n    plan, report = build_plan(plan_id="all-pcap", name="All PCAP", dataset_path=capture)\n    metric_ids = {metric["metric_id"] for metric in plan["metrics"]}\n\n    assert metric_ids == PCAP_SUPPORTED_METRICS\n    assert report["runnable_metric_count"] == 20\n    assert report["metrics"]["handshake_plausibility_profile"]["status"] == "needs_configuration"\n    assert report["metrics"]["handshake_plausibility_profile"]["reason"] == "capture_boundary_policy_required"\n    for metric_id in PCAP_SELF_DERIVED_METRICS:\n        assert report["metrics"][metric_id]["status"] == "not_applicable"\n        assert report["metrics"][metric_id]["reason"] == "self_derived_pcap_invariant_not_independent"\n\n\ndef test_distance_correlation_pcap_template_declares_computational_cap(tmp_path):\n    capture = tmp_path / "capture.pcap"\n    _write_capture(capture, packet_count=1100)\n    dataframe = build_pcap_packet_dataframe(capture)\n    handlers = build_metric_handlers(dataframe, lambda _path: None, {})\n    metric = pcap_metric_template("distance_correlation_matrix_deviation")\n\n    ok, payload = handlers["distance_correlation_matrix_deviation"](capture, metric)\n\n    assert ok is True\n    assert payload["sampling"] == {\n        "method": "deterministic_evenly_spaced_rows",\n        "original_row_count": 1100,\n        "sampled_row_count": 1000,\n        "max_sample_size": 1000,\n    }\n\n\ndef test_context_configuration_reasons_are_not_silent_exclusions():\n    assert PCAP_CONTEXT_CONFIGURATION_REASONS == {\n        "handshake_plausibility_profile": "capture_boundary_policy_required"\n    }\n''', encoding='utf-8')

          # Documentation: replace the old two-adapter-metric PCAP planning description.
          p = Path('docs/plan_creation.md')
          text = p.read_text(encoding='utf-8')
          old = '''Raw packet captures now use a canonical packet adapter for metrics whose inputs can be copied directly from decoded packets. In addition to the direct packet-capture metrics, automatic PCAP plans can therefore include `reserved_ip_address_profile` and `valid_port_range_profile`.\n\nThe planner deliberately does **not** enable tabular flow self-consistency metrics merely because CBR-Tests can reconstruct equivalent fields from the same capture. Checks such as flow-duration/IAT arithmetic, packet/byte arithmetic and derived-rate arithmetic would otherwise validate values calculated by the adapter against other values calculated by the adapter. Those exclusions are reported as `self_derived_pcap_invariant_not_independent`.\n\nA canonical bidirectional 5-tuple flow view is still available internally for later sequence-aware and reference-comparison metrics. It does not assume an exporter idle timeout, so it is not silently treated as equivalent to CICFlowMeter or another exporter.\n'''
          new = '''Raw packet captures use a canonical decoded-packet adapter and automatic planning now includes **every currently safe runnable existing metric** for that representation, not just a packet-specific shortlist. The current automatic PCAP set contains 20 metrics: the two direct PCAP checks plus packet-address/port checks, three data-quality profiles, three dependency profiles, four internal distribution-drift metrics, and six packet-timestamp temporal metrics.\n\nThe shared packet view contains capture-order index, epoch timestamp, source/destination IPs, transport ports where present, protocol, IP version, packet length, TCP flags, and capture-order inter-arrival time. Numeric dependence/drift templates deliberately use packet length and inter-arrival time; port identifiers and TCP flag bitmasks are not treated as continuous ordinal measurements. PCAP epoch timestamps are explicitly parsed with unit `s` rather than relying on pandas' numeric timestamp default.\n\n`distance_correlation_matrix_deviation` is quadratic in sample size, so the PCAP template declares a transparent computational safeguard: at most 1000 deterministically evenly spaced packet rows are used for that metric. The outcome records the sampling method and original/sample row counts. Other metrics keep their existing metric-specific sampling semantics.\n\nThe planner deliberately does **not** enable flow self-consistency metrics merely because CBR-Tests can reconstruct equivalent fields from the same capture. Checks such as start/end-versus-duration arithmetic, aggregate packet/byte arithmetic and derived-rate arithmetic would otherwise validate values calculated by the adapter against other values calculated by the adapter. Those exclusions are reported as `self_derived_pcap_invariant_not_independent`. `handshake_plausibility_profile` is reported as `needs_configuration` with `capture_boundary_policy_required`, because an arbitrary capture may begin in the middle of established TCP sessions and the planner must not guess that capture-boundary assumption.\n\nA canonical bidirectional 5-tuple flow view is still available internally for later sequence-aware and reference-comparison metrics. It does not assume an exporter idle timeout, so it is not silently treated as equivalent to CICFlowMeter or another exporter.\n'''
          if old not in text:
              raise SystemExit('PCAP planning documentation block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('docs/metrics/packet_capture.md')
          text = p.read_text(encoding='utf-8')
          marker = '## Canonical PCAP adapter\n'
          if marker not in text:
              raise SystemExit('Packet capture canonical section missing')
          prefix = text[:text.index(marker)]
          suffix = '''## Canonical PCAP adapter\n\nPCAP/PCAPNG files are decoded into a shared packet view containing capture-order index, epoch timestamp, IP addresses, transport ports where present, protocol, IP version, packet length, TCP flags, and capture-order inter-arrival time. Automatic PCAP plans currently include all 20 existing metrics that can use this evidence without inventing dataset-specific research configuration.\n\nBeyond `protocol_validity_profile` and `timestamp_coherence_profile`, this includes address/port validation, data-quality profiles, packet-length/inter-arrival dependency profiles, four internal distribution-drift profiles, and the timestamp-based temporal suite. Missing ports/TCP flags are protocol-conditional and should be read descriptively. Repeated packet signatures may also be legitimate retransmissions or repeated requests.\n\nPCAP timestamps are floating-point Unix seconds, so the temporal templates explicitly declare `timestamp_unit: s`; this avoids pandas interpreting raw numeric timestamps as nanoseconds. Distance correlation uses a deterministic evenly spaced maximum of 1000 rows because the exact implementation is quadratic, and reports that computational sampling in the metric payload.\n\nThe adapter also exposes a bidirectional 5-tuple flow view for future sequence/reference work. Current automatic plans intentionally exclude self-consistency tests whose compared values would both be derived by this adapter, because those passes would not provide independent evidence about dataset realism. Aggregate handshake plausibility is also not auto-enabled until capture-boundary policy is supplied explicitly.\n'''
          p.write_text(prefix + suffix, encoding='utf-8')
          PY
      - name: Validate implementation
        run: |
          python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
          python -m pytest -q tests/test_pcap_adapter.py tests/test_pcap_all_runnable_metrics.py tests/test_plan_builder.py tests/test_temporal_metrics_profile.py
          python -m pytest -q
      - name: Regenerate references
        run: python scripts/build_reference_documentation.py
      - name: Verify generated references and docs
        run: |
          git diff --check
          python scripts/build_reference_documentation.py --check
      - name: Commit implementation and remove temporary workflow
        run: |
          rm .github/workflows/apply-pcap-all-runnable.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Run all safe existing metrics on raw PCAP"
          git push origin HEAD:agent/pcap-all-runnable-metrics
