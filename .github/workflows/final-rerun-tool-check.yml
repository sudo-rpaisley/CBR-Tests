name: Final rerun tool check

on:
  push:
    branches:
      - overhaul/metric-conformance

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/metric-conformance

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Regenerate documentation
        run: python scripts/build_reference_documentation.py

      - name: Run full tests
        run: python -m pytest -q

      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/function_reference.md docs/test_reference.md
          if git diff --cached --quiet; then
            echo "Generated documentation is already current."
            exit 0
          fi
          git commit -m "Refresh generated docs for outcome comparison"
          git push origin HEAD:overhaul/metric-conformance
