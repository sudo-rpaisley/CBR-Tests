name: Finalize batch-aware TUI

on:
  push:
    branches:
      - feature/batch-aware-runner-tui

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[batch-tui-finalized]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/batch-aware-runner-tui
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Wire unified TUI into runner
        run: |
          python - <<'PY'
          from pathlib import Path

          helpers = Path('runner/run_plan_helpers.py')
          text = helpers.read_text(encoding='utf-8')

          legacy_import = 'from runner.tui import launch_tui, validate_required_run_args\n'
          first_unified_import = (
              'from runner.tui import validate_required_run_args\n'
              'from runner.unified_tui import launch_unified_tui\n'
          )
          compatible_import = (
              'from runner.tui import launch_tui as _legacy_launch_tui, validate_required_run_args\n'
              'from runner.unified_tui import launch_unified_tui\n\n'
              '# Keep the historical module-level launch_tui hook so tests and callers that\n'
              '# monkeypatch it continue to work. Normal execution uses the unified chooser.\n'
              'launch_tui = _legacy_launch_tui\n\n\n'
              'def _launch_tui_entry(args):\n'
              '    if launch_tui is not _legacy_launch_tui:\n'
              '        return launch_tui(args)\n'
              '    return launch_unified_tui(args)\n'
          )
          if legacy_import in text:
              text = text.replace(legacy_import, compatible_import, 1)
          elif first_unified_import in text:
              text = text.replace(first_unified_import, compatible_import, 1)
          elif 'def _launch_tui_entry(args):\n' not in text:
              raise SystemExit('expected run_plan_helpers TUI import not found')

          old_launch = '''        args = launch_tui(args)\n        args.tui_session = True\n    validate_required_run_args(args)\n    return args\n'''
          first_new_launch = '''        args = launch_unified_tui(args)\n        args.tui_session = not bool(getattr(args, "tui_batch_spec", None))\n    if not getattr(args, "tui_batch_spec", None):\n        validate_required_run_args(args)\n    return args\n'''
          final_launch = '''        args = _launch_tui_entry(args)\n        args.tui_session = not bool(getattr(args, "tui_batch_spec", None))\n    if not getattr(args, "tui_batch_spec", None):\n        validate_required_run_args(args)\n    return args\n'''
          if old_launch in text:
              text = text.replace(old_launch, final_launch, 1)
          elif first_new_launch in text:
              text = text.replace(first_new_launch, final_launch, 1)
          elif final_launch not in text:
              raise SystemExit('expected run_plan_helpers launch block not found')
          helpers.write_text(text, encoding='utf-8')

          runner = Path('run_plan.py')
          text = runner.read_text(encoding='utf-8')
          old_main = '''def main():\n    args = parse_run_plan_args()\n    while True:\n'''
          new_main = '''def main():\n    args = parse_run_plan_args()\n    batch_spec = getattr(args, "tui_batch_spec", None)\n    if batch_spec:\n        from runner.tui_batch import execute_batch_spec\n\n        return execute_batch_spec(batch_spec)\n\n    while True:\n'''
          if old_main in text:
              text = text.replace(old_main, new_main, 1)
          elif new_main not in text:
              raise SystemExit('expected run_plan main block not found')
          runner.write_text(text, encoding='utf-8')

          Path('ci_batch_tui_test_output.txt').unlink(missing_ok=True)
          Path('ci_batch_tui_test_status.txt').unlink(missing_ok=True)
          PY

      - name: Compile and run tests
        run: |
          set +e
          python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' . > ci_batch_tui_test_output.txt 2>&1
          compile_status=$?
          python -m pytest -q >> ci_batch_tui_test_output.txt 2>&1
          test_status=$?
          if [ "$compile_status" -ne 0 ]; then status=$compile_status; else status=$test_status; fi
          echo "$status" > ci_batch_tui_test_status.txt
          cat ci_batch_tui_test_output.txt
          exit 0

      - name: Persist validation failure for inspection
        run: |
          status="$(cat ci_batch_tui_test_status.txt)"
          if [ "$status" -eq 0 ]; then
            rm -f ci_batch_tui_test_output.txt ci_batch_tui_test_status.txt
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Capture batch TUI validation failure [batch-tui-finalized]'
          git push origin HEAD:feature/batch-aware-runner-tui
          exit 1

      - name: Regenerate reference documentation
        run: python scripts/build_reference_documentation.py

      - name: Remove temporary workflow
        run: rm .github/workflows/finalize-batch-aware-tui.yml

      - name: Commit finalized feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize batch-aware runner TUI [batch-tui-finalized]'
          git push origin HEAD:feature/batch-aware-runner-tui
