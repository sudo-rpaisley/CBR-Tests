name: Finalize batch recovery

on:
  push:
    branches:
      - feature/batch-resume-and-browser-hardening

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[batch-recovery-finalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/batch-resume-and-browser-hardening

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Finalize interrupted-job resume handling and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('run_batch.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '        prior_results = result_map(state)\n        print(\n',
              '        prior_results = result_map(state)\n        interrupted_job = state.get("current_job") if isinstance(state.get("current_job"), dict) else None\n        print(\n',
          )
          text = text.replace(
              '        prior_results = {}\n\n    results: list[dict] = []\n',
              '        prior_results = {}\n        interrupted_job = None\n\n    results: list[dict] = []\n',
          )
          text = text.replace(
              '        prior = prior_results.get(job_id)\n        should_retry = bool(prior and args.retry_failed and _result_needs_attention(prior))\n\n        if prior is not None and not should_retry:\n',
              '        prior = prior_results.get(job_id)\n        should_retry = bool(prior and args.retry_failed and _result_needs_attention(prior))\n        was_interrupted_current = bool(\n            args.resume\n            and prior is None\n            and interrupted_job\n            and str(interrupted_job.get("job_id")) == job_id\n        )\n\n        if prior is not None and not should_retry:\n',
          )
          text = text.replace(
              '        attempt = int(prior.get("attempt", 1)) + 1 if should_retry and prior else 1\n',
              '        if should_retry and prior:\n            attempt = int(prior.get("attempt", 1)) + 1\n        elif was_interrupted_current:\n            attempt = int(interrupted_job.get("attempt", 1)) + 1\n        else:\n            attempt = 1\n',
          )
          text = text.replace(
              '    state["status"] = batch_status\n    state["current_job"] = None\n    state["results"] = results\n',
              '    state["status"] = batch_status\n    if not interrupted:\n        state["current_job"] = None\n    state["results"] = results\n',
          )
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_batch_tui.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace('from argparse import Namespace\n', 'from argparse import Namespace\nfrom datetime import datetime\n')
          tests = tests.replace(
              '            "name": "Experiment",\n            "datasets": [str(dataset)],\n',
              '            "name": "Experiment",\n            "run_id": "20260902-122000",\n            "datasets": [str(dataset)],\n',
          )
          tests = tests.replace(
              '    assert created["dataset_paths"] == [dataset.resolve()]\n',
              '    assert created["plan_id"] == "experiment-20260902-122000"\n    assert created["dataset_paths"] == [dataset.resolve()]\n',
          )
          addition = '''\n\ndef test_default_batch_run_id_is_timestamped():\n    assert tui_batch.default_batch_run_id(datetime(2026, 9, 2, 12, 20, 45)) == "20260902-122045"\n\n\ndef test_build_batch_spec_rejects_unsupported_dataset_type():\n    with pytest.raises(ValueError, match="Unsupported candidate dataset type"):\n        tui_batch.build_batch_spec(name="x", datasets=["notes.md"])\n\n\ndef test_batch_browser_only_lists_supported_dataset_files(tmp_path):\n    (tmp_path / "nested").mkdir()\n    (tmp_path / "candidate.csv").write_text("a\\n1\\n", encoding="utf-8")\n    (tmp_path / "capture.pcap").write_bytes(b"")\n    (tmp_path / "notes.md").write_text("ignore", encoding="utf-8")\n    (tmp_path / "plan.json").write_text("{}", encoding="utf-8")\n\n    entries = tui_batch._browser_entries(tmp_path, tmp_path)\n    labels = {entry.label for entry in entries}\n    assert "nested/" in labels\n    assert "candidate.csv" in labels\n    assert "capture.pcap" in labels\n    assert "notes.md" not in labels\n    assert "plan.json" not in labels\n'''
          if 'test_default_batch_run_id_is_timestamped' not in tests:
              tests += addition
          test_path.write_text(tests, encoding='utf-8')

          doc_path = Path('docs/batch_runner_tui.md')
          docs = doc_path.read_text(encoding='utf-8')
          docs = docs.replace(
              'Backspace   go to the parent directory\nq / Esc     cancel without changing the field\n',
              'Backspace   go to the parent directory\ne           type/paste a path or directory\nR           jump to the repository root\nH           jump to the current user home directory\nM           jump to /media when available\nq / Esc     cancel without changing the field\n',
          )
          docs = docs.replace(
              'Selected files are marked with `[x]`, and the footer shows the selection count.\n',
              'Selected files are marked with `[x]`, and the footer shows the selection count. The browser only exposes supported dataset files (`.csv`, `.tsv`, `.xlsx`, `.xls`, `.pcap`, `.pcapng`) while still showing directories for navigation.\n\nEach TUI batch also receives an automatically generated run ID such as `20260902-122045`. The human-readable batch name remains reusable, while the generated plan/batch ID combines the name and run ID so repeated experiments do not collide by default.\n',
          )
          recovery = '''\n## Checkpoints, resume and retry\n\n`run_batch.py` writes an atomic `batch_state.json` checkpoint in the batch output directory before and after job execution. The checkpoint records the exact batch-manifest SHA-256 fingerprint, run timestamp, current job and completed results. A resume is rejected if the manifest has changed, preventing a partially completed experiment from silently continuing with different plans or datasets.\n\nIf a run is interrupted, resume it with:\n\n```bash\npython run_batch.py --batch plans/<batch>_batch.json --resume\n```\n\nPreviously completed/attempted jobs are skipped. A job that was actively running when interruption occurred is restarted automatically as a new attempt with a new outcome filename such as `_retry02`, so a possibly partial first output is never overwritten.\n\nTo deliberately rerun jobs whose previous result needs attention, use:\n\n```bash\npython run_batch.py --batch plans/<batch>_batch.json --resume --retry-failed\n```\n\nRetry attempts retain attempt history in the batch checkpoint and write new outcome files rather than replacing the previous attempt.\n'''
          if '## Checkpoints, resume and retry' not in docs:
              docs += recovery
          doc_path.write_text(docs, encoding='utf-8')
          PY

      - name: Compile and run tests
        run: |
          python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
          python -m pytest -q

      - name: Regenerate reference documentation
        run: python scripts/build_reference_documentation.py

      - name: Validate generated docs and links
        run: |
          python scripts/build_reference_documentation.py --check
          python - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import unquote
          failures = []
          pattern = re.compile(r"(?<!!)\[[^\]]*\]\(([^)]+)\)")
          for document in [Path('README.md'), *sorted(Path('docs').rglob('*.md'))]:
              text = document.read_text(encoding='utf-8')
              for raw_target in pattern.findall(text):
                  target = raw_target.strip().split()[0].strip('<>')
                  if not target or target.startswith(('http://', 'https://', 'mailto:', '#')):
                      continue
                  path_text = unquote(target.split('#', 1)[0])
                  if path_text and not (document.parent / path_text).resolve().exists():
                      failures.append(f'{document}: {target}')
          if failures:
              raise SystemExit('Broken local documentation links:\n' + '\n'.join(failures))
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/finalize-batch-recovery.yml

      - name: Commit finalized feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run_batch.py runner/batch_state.py runner/tui_batch.py tests/test_batch_state.py tests/test_batch_tui.py docs/batch_runner_tui.md docs/function_reference.md docs/test_reference.md .github/workflows/finalize-batch-recovery.yml
          git commit -m "Finalize batch recovery and browser hardening [batch-recovery-finalized]"
          git push origin HEAD:feature/batch-resume-and-browser-hardening
