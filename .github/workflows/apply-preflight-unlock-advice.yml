name: Apply preflight unlock advice

on:
  push:
    branches:
      - agent/preflight-unlock-advice

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preflight-unlock-advice
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Apply integration patch
        run: python scripts/apply_preflight_advice_patch.py
      - name: Compile
        run: python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
      - name: Targeted tests
        run: python -m pytest -q tests/test_plan_builder.py
      - name: Full suite
        run: python -m pytest -q
      - name: Refresh generated references
        run: |
          python scripts/build_reference_documentation.py
          python scripts/build_reference_documentation.py --check
      - name: Commit validated implementation and clean temporary files
        run: |
          rm .github/workflows/apply-preflight-unlock-advice.yml
          rm scripts/apply_preflight_advice_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner/preflight_advice.py runner/plan_builder.py create_plan.py tests/test_plan_builder.py docs/plan_creation.md README.md docs/function_reference.md docs/test_reference.md .github/workflows/apply-preflight-unlock-advice.yml scripts/apply_preflight_advice_patch.py
          git commit -m "Explain how to unlock excluded metrics"
          git push
