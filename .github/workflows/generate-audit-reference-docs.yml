name: Finalise audit reference docs

on:
  pull_request:
    branches:
      - overhaul/metric-conformance

permissions:
  contents: write

jobs:
  finalise:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Regenerate checked-in references
        run: python scripts/build_reference_documentation.py
      - name: Commit generated references and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-audit-reference-docs.yml
          git add docs/function_reference.md docs/test_reference.md
          git commit -m "Regenerate audit reference documentation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
