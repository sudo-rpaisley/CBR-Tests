name: Regenerate reference documentation

on:
  push:
    branches:
      - "test/harden-optimisation-regressions"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: test/harden-optimisation-regressions

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate references
        run: python scripts/build_reference_documentation.py

      - name: Commit generated documentation
        run: |
          if git diff --quiet -- docs/function_reference.md docs/test_reference.md; then
            echo "Reference documentation already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/function_reference.md docs/test_reference.md
          git commit -m "Regenerate test reference documentation"
          git push
