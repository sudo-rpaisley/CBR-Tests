name: Regenerate reference docs

on:
  push:
    branches:
      - agent/plan-creation-ux

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/plan-creation-ux
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate references
        run: python scripts/build_reference_documentation.py
      - name: Commit generated references
        run: |
          if git diff --quiet -- docs/function_reference.md docs/test_reference.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/function_reference.md docs/test_reference.md
          git commit -m "Regenerate reference documentation"
          git push origin HEAD:agent/plan-creation-ux
