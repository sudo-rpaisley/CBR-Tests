name: Apply pre-experiment conformance fixes

on:
  pull_request:
    branches:
      - overhaul/metric-conformance

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/paper-metric-traceability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scientific-contract fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # F4/F5: do not advertise decoder-derived or structurally ambiguous
          # packet-view checks as independent automatic PCAP realism evidence.
          replace_once(
              'runner/pcap_adapter.py',
              '''# Metrics that can consume the canonical decoded-packet view without requiring\n# dataset-specific research assumptions.\nPCAP_PACKET_NETWORK_METRICS = {\n    "valid_ip_address_ratio",\n    "valid_port_range_profile",\n}\n\nPCAP_PACKET_DATA_QUALITY_METRICS = {\n    "column_quality_profile",\n    "missing_value_ratio",\n    "duplicate_row_ratio",\n}\n''',
              '''# Metrics that can consume the canonical decoded-packet view and provide\n# independent evidence without merely re-validating adapter-produced values.\nPCAP_PACKET_NETWORK_METRICS: set[str] = set()\n\nPCAP_PACKET_DATA_QUALITY_METRICS = {\n    "column_quality_profile",\n    "duplicate_row_ratio",\n}\n\n# These handlers remain runnable for historical/manual diagnostics, but the\n# canonical packet adapter has already parsed/normalised their inputs (or has\n# protocol-dependent structural absence). They must therefore not be added to\n# automatically generated PCAP realism plans.\nPCAP_AUTOMATIC_EXCLUSIONS = {\n    "valid_ip_address_ratio": "decoder_derived_ip_validity_not_independent",\n    "valid_port_range_profile": "decoder_derived_port_validity_not_independent",\n    "timestamp_parse_success_ratio": "adapter_converted_timestamp_parse_not_independent",\n    "missing_value_ratio": "pcap_missingness_requires_applicability_aware_denominator",\n}\n'''
          )
          replace_once(
              'runner/pcap_adapter.py',
              '''PCAP_PACKET_TEMPORAL_METRICS = {\n    "timestamp_parse_success_ratio",\n    "inter_arrival_internal_drift_ks",''',
              '''PCAP_PACKET_TEMPORAL_METRICS = {\n    "inter_arrival_internal_drift_ks",'''
          )
          replace_once(
              'runner/pcap_adapter.py',
              '''PCAP_PACKET_BACKED_METRICS = (\n    PCAP_PACKET_METRICS | PCAP_REFERENCE_METRICS | PCAP_EXPLICIT_PACKET_METRICS\n)''',
              '''PCAP_PACKET_BACKED_METRICS = (\n    PCAP_PACKET_METRICS\n    | set(PCAP_AUTOMATIC_EXCLUSIONS)\n    | PCAP_REFERENCE_METRICS\n    | PCAP_EXPLICIT_PACKET_METRICS\n)'''
          )

          replace_once(
              'runner/plan_builder.py',
              '''from runner.pcap_adapter import (\n    PCAP_CONTEXT_CONFIGURATION_REASONS,''',
              '''from runner.pcap_adapter import (\n    PCAP_AUTOMATIC_EXCLUSIONS,\n    PCAP_CONTEXT_CONFIGURATION_REASONS,'''
          )
          replace_once(
              'runner/plan_builder.py',
              '''        if metric_id in PCAP_SELF_DERIVED_METRICS:\n            return "not_applicable", "self_derived_pcap_invariant_not_independent", []\n        if metric_id in PCAP_PACKET_METRICS:''',
              '''        if metric_id in PCAP_SELF_DERIVED_METRICS:\n            return "not_applicable", "self_derived_pcap_invariant_not_independent", []\n        automatic_exclusion = PCAP_AUTOMATIC_EXCLUSIONS.get(metric_id)\n        if automatic_exclusion:\n            return "not_applicable", automatic_exclusion, []\n        if metric_id in PCAP_PACKET_METRICS:'''
          )

          # F6: freeze a field-qualified identifier universe. Identical text in
          # different identifier namespaces must never create cross-field overlap.
          replace_once(
              'cbr_tests/metrics/label_fidelity.py',
              '''    contaminated = total_test = total_union = 0\n    fields = []''',
              '''    qualified_train_ids: set[tuple[str, str]] = set()\n    qualified_test_ids: set[tuple[str, str]] = set()\n    fields = []'''
          )
          replace_once(
              'cbr_tests/metrics/label_fidelity.py',
              '''        total_test += len(test_ids)\n        total_union += len(union)\n        contaminated += len(overlap)\n        overlap_ratio = len(overlap) / len(test_ids) if test_ids else None''',
              '''        qualified_train_ids.update((field, value) for value in train_ids)\n        qualified_test_ids.update((field, value) for value in test_ids)\n        overlap_ratio = len(overlap) / len(test_ids) if test_ids else None'''
          )
          replace_once(
              'cbr_tests/metrics/label_fidelity.py',
              '''    overlap_ratio = contaminated / total_test if total_test else None\n    return {''',
              '''    qualified_overlap = qualified_train_ids & qualified_test_ids\n    qualified_union = qualified_train_ids | qualified_test_ids\n    total_test = len(qualified_test_ids)\n    total_union = len(qualified_union)\n    contaminated = len(qualified_overlap)\n    overlap_ratio = contaminated / total_test if total_test else None\n    return {'''
          )
          replace_once(
              'cbr_tests/metrics/label_fidelity.py',
              '''            "entity_disjoint_expected": entity_disjoint_expected,\n            "test_identifier_count": total_test,''',
              '''            "entity_disjoint_expected": entity_disjoint_expected,\n            "identifier_universe": "field_qualified_(field,value)",\n            "test_identifier_count": total_test,'''
          )
          replace_once(
              'cbr_tests/metrics/label_fidelity.py',
              '''    """Measure test identifiers already seen in train when entity-disjoint evaluation is required."""''',
              '''    """Measure field-qualified test identifiers already seen in train.\n\n    The canonical identifier universe is ``(field, value)`` so equal textual\n    values in different namespaces cannot create false contamination.\n    """'''
          )

          # F7: state precisely what the TCP flag metric validates.
          replace_once(
              'cbr_tests/metrics/protocol_network/flow_semantics/tcp_flag_consistency_profile.py',
              '''def run_tcp_flag_consistency_metric(dataset_path: Path, metric: dict) -> tuple[bool, dict]:\n    field_map = metric.get("input_requirements", {}).get("field_map", {})''',
              '''def run_tcp_flag_consistency_metric(dataset_path: Path, metric: dict) -> tuple[bool, dict]:\n    """Check deterministic aggregate TCP flag-count invariants on flow rows.\n\n    This metric is not a packet-sequence TCP state-machine validator. Unusual\n    packet-level flag combinations can be legitimate security/attack evidence\n    and require a separate sequence-aware metric.\n    """\n    field_map = metric.get("input_requirements", {}).get("field_map", {})'''
          )
          replace_once(
              'cbr_tests/metrics/protocol_network/flow_semantics/tcp_flag_consistency_profile.py',
              '''        "tcp_flag_consistency_ratio": ratio,\n        "negative_flag_count":''',
              '''        "tcp_flag_consistency_ratio": ratio,\n        "scope": "aggregate_tcp_flag_count_invariants",\n        "negative_flag_count":'''
          )

          # F8: overlapping rules are only valid when they encode the same
          # expected set. Differing expected sets are an invalid experiment contract.
          replace_once(
              'cbr_tests/metrics/protocol_network/slice_metadata_integrity/slice_identifier_consistency_profile.py',
              '''    Rows with no applicable rule are outside the metric denominator. Missing slice\n    values are completeness evidence and are excluded from the canonical\n    consistency denominator by default; ``count_invalid`` remains available as a\n    legacy/strict policy.\n''',
              '''    Rows with no applicable rule are outside the metric denominator. Missing slice\n    values are completeness evidence and are excluded from the canonical\n    consistency denominator by default; ``count_invalid`` remains available as a\n    legacy/strict policy. If multiple rules match the same row, they must declare\n    identical expected slice sets; conflicting overlaps are rejected as an invalid\n    experiment configuration rather than unioned into a more permissive rule.\n'''
          )
          replace_once(
              'cbr_tests/metrics/protocol_network/slice_metadata_integrity/slice_identifier_consistency_profile.py',
              '''    for idx, row in df.iterrows():\n        matched = []\n        expected = set()\n        for pr in prepared_rules:\n            if pr is None:\n                continue\n            if _rule_match(row[pr["when_field"]], pr["operator"], pr["value"], case_sensitive):\n                pr["application_count"] += 1\n                matched.append(pr["rule_index"])\n                expected.update(pr["expected"])\n                rule_app += 1\n\n        if not matched:\n            unmatched += 1\n            continue\n''',
              '''    for idx, row in df.iterrows():\n        matched = []\n        matched_expected_sets = []\n        for pr in prepared_rules:\n            if pr is None:\n                continue\n            if _rule_match(row[pr["when_field"]], pr["operator"], pr["value"], case_sensitive):\n                pr["application_count"] += 1\n                matched.append(pr["rule_index"])\n                matched_expected_sets.append(set(pr["expected"]))\n                rule_app += 1\n\n        if not matched:\n            unmatched += 1\n            continue\n\n        if len(matched_expected_sets) > 1 and any(\n            expected_set != matched_expected_sets[0]\n            for expected_set in matched_expected_sets[1:]\n        ):\n            return False, {\n                "error": "Conflicting slice-consistency rules match the same row.",\n                "reason_code": "conflicting_overlapping_slice_rules",\n                "row_index": int(idx) if isinstance(idx, int) else str(idx),\n                "matched_rules": matched,\n                "expected_slice_sets": [sorted(values) for values in matched_expected_sets],\n                "overlap_policy": "identical_expected_sets_only",\n            }\n\n        expected = matched_expected_sets[0] if matched_expected_sets else set()\n'''
          )
          replace_once(
              'cbr_tests/metrics/protocol_network/slice_metadata_integrity/slice_identifier_consistency_profile.py',
              '''        "denominator_policy": "applicable_rows_with_non_missing_slice" if missing_policy == "exclude_missing" else "applicable_rows_with_missing_counted_invalid",\n        "rules_applied_summary": summary,''',
              '''        "denominator_policy": "applicable_rows_with_non_missing_slice" if missing_policy == "exclude_missing" else "applicable_rows_with_missing_counted_invalid",\n        "overlap_policy": "identical_expected_sets_only",\n        "rules_applied_summary": summary,'''
          )

          # Update existing PCAP tests so they test evidence independence rather
          # than merely successful execution of tautological diagnostics.
          p = Path('tests/test_pcap_adapter.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '    PCAP_FLOW_COLUMNS,\n',
              '    PCAP_AUTOMATIC_EXCLUSIONS,\n    PCAP_FLOW_COLUMNS,\n',
              1,
          )
          pattern = re.compile(r'def test_packet_adapted_metrics_run_on_raw_packet_view\(tmp_path\):.*?\n\ndef test_self_derived_flow_invariants_are_not_exposed_as_pcap_templates', re.S)
          replacement = '''def test_decoder_derived_metrics_remain_diagnostic_but_are_not_automatic_pcap_evidence(tmp_path):\n    capture = tmp_path / "sample.pcap"\n    _write_capture(capture)\n    dataframe = build_pcap_packet_dataframe(capture)\n\n    decoder_derived = {\n        "valid_ip_address_ratio",\n        "valid_port_range_profile",\n        "timestamp_parse_success_ratio",\n        "missing_value_ratio",\n    }\n    assert decoder_derived == set(PCAP_AUTOMATIC_EXCLUSIONS)\n    assert decoder_derived.isdisjoint(PCAP_PACKET_METRICS)\n\n    def forbidden_loader(_path):\n        raise AssertionError("packet-view diagnostic attempted to reload PCAP as tabular data")\n\n    handlers = build_metric_handlers(dataframe, forbidden_loader, {})\n    for metric_id in sorted(decoder_derived):\n        metric = pcap_metric_template(metric_id)\n        assert metric is not None\n        ok, payload = handlers[metric_id](capture, metric)\n        assert ok is True, (metric_id, payload)\n        assert metric_id in payload["test_results"]\n\n\ndef test_self_derived_flow_invariants_are_not_exposed_as_pcap_templates'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace decoder-derived PCAP adapter test')
          p.write_text(text, encoding='utf-8')

          p = Path('tests/test_pcap_all_runnable_metrics.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '    PCAP_CONTEXT_CONFIGURATION_REASONS,\n',
              '    PCAP_AUTOMATIC_EXCLUSIONS,\n    PCAP_CONTEXT_CONFIGURATION_REASONS,\n',
              1,
          )
          text = text.replace('    assert len(PCAP_PACKET_METRICS) == 18\n    assert len(PCAP_SUPPORTED_METRICS) == 20\n    assert "valid_ip_address_ratio" in PCAP_PACKET_METRICS\n',
                              '    assert len(PCAP_PACKET_METRICS) == 14\n    assert len(PCAP_SUPPORTED_METRICS) == 16\n    assert set(PCAP_AUTOMATIC_EXCLUSIONS).isdisjoint(PCAP_SUPPORTED_METRICS)\n')
          parse_block = '''\n    parse_metric = pcap_metric_template("timestamp_parse_success_ratio")\n    ok, payload = handlers["timestamp_parse_success_ratio"](capture, parse_metric)\n    assert ok is True\n    summary = payload["test_results"]["timestamp_parse_success_ratio"]["summary"]\n    assert summary["timestamp_parse_success_ratio"] == 1.0\n'''
          if parse_block not in text:
              raise SystemExit('Timestamp parse assertion block not found')
          text = text.replace(parse_block, '\n', 1)
          text = text.replace('def test_automatic_pcap_plan_contains_all_twenty_currently_runnable_metrics',
                              'def test_automatic_pcap_plan_contains_only_independent_currently_runnable_metrics')
          text = text.replace('    assert report["runnable_metric_count"] == 20\n    assert report["metrics"]["valid_ip_address_ratio"]["status"] == "ready"\n',
                              '    assert report["runnable_metric_count"] == len(PCAP_SUPPORTED_METRICS)\n    for metric_id, reason in PCAP_AUTOMATIC_EXCLUSIONS.items():\n        assert metric_id not in metric_ids\n        assert report["metrics"][metric_id]["status"] == "not_applicable"\n        assert report["metrics"][metric_id]["reason"] == reason\n')
          p.write_text(text, encoding='utf-8')

          p = Path('tests/test_plan_builder.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '    PCAP_DIRECT_METRICS,\n',
              '    PCAP_AUTOMATIC_EXCLUSIONS,\n    PCAP_DIRECT_METRICS,\n',
              1,
          )
          anchor = '''    for metric_id in PCAP_SELF_DERIVED_METRICS:\n        assert metric_id not in metric_ids\n        assert report["metrics"][metric_id]["reason"] == "self_derived_pcap_invariant_not_independent"\n'''
          addition = anchor + '''    for metric_id, reason in PCAP_AUTOMATIC_EXCLUSIONS.items():\n        assert metric_id not in metric_ids\n        assert report["metrics"][metric_id]["reason"] == reason\n'''
          if anchor not in text:
              raise SystemExit('PCAP plan-builder assertion anchor not found')
          text = text.replace(anchor, addition, 1)
          p.write_text(text, encoding='utf-8')

          # Add focused scientific-contract regression tests.
          Path('tests/test_preexperiment_metric_contract.py').write_text('''from pathlib import Path\n\nimport pandas as pd\n\nfrom cbr_tests.metrics.label_fidelity import compute_train_test_identifier_contamination_ratio\nfrom cbr_tests.metrics.protocol_network.flow_semantics.tcp_flag_consistency_profile import run_tcp_flag_consistency_metric\nfrom cbr_tests.metrics.protocol_network.slice_metadata_integrity.slice_identifier_consistency_profile import run_slice_identifier_consistency_metric\nfrom runner.pcap_adapter import PCAP_AUTOMATIC_EXCLUSIONS, PCAP_SUPPORTED_METRICS\nfrom runner.plan_builder import build_plan\n\n\ndef test_automatic_pcap_plan_excludes_nonindependent_decoder_evidence(tmp_path: Path):\n    capture = tmp_path / "capture.pcap"\n    capture.write_bytes(b"placeholder")\n    plan, report = build_plan(plan_id="pcap-contract", name="PCAP contract", dataset_path=capture)\n    included = {metric["metric_id"] for metric in plan["metrics"]}\n    assert included == PCAP_SUPPORTED_METRICS\n    for metric_id, reason in PCAP_AUTOMATIC_EXCLUSIONS.items():\n        assert metric_id not in included\n        assert report["metrics"][metric_id]["status"] == "not_applicable"\n        assert report["metrics"][metric_id]["reason"] == reason\n\n\ndef test_identifier_contamination_uses_field_qualified_namespaces():\n    df = pd.DataFrame({\n        "split": ["train", "test"],\n        "device_id": ["same-text", "device-2"],\n        "user_id": ["user-1", "same-text"],\n    })\n    metric = {"input_requirements": {\n        "split_field": "split",\n        "identifier_fields": ["device_id", "user_id"],\n        "entity_disjoint_expected": True,\n    }}\n    summary = compute_train_test_identifier_contamination_ratio(df, metric)["summary"]\n    assert summary["identifier_universe"] == "field_qualified_(field,value)"\n    assert summary["overlap_identifier_count"] == 0\n    assert summary["train_test_identifier_contamination_ratio"] == 0.0\n\n\ndef test_conflicting_overlapping_slice_rules_are_rejected():\n    df = pd.DataFrame({"service": ["video"], "slice": ["s1"]})\n    metric = {\n        "input_requirements": {"slice_field": "slice"},\n        "calculation": {"parameters": {"rules": [\n            {"when_field": "service", "operator": "equals", "value": "video", "expected_slice_ids": ["s1"]},\n            {"when_field": "service", "operator": "contains", "value": "vid", "expected_slice_ids": ["s2"]},\n        ]}},\n        "_shared_df": df,\n    }\n    ok, payload = run_slice_identifier_consistency_metric(Path("unused.csv"), metric)\n    assert ok is False\n    assert payload["reason_code"] == "conflicting_overlapping_slice_rules"\n    assert payload["overlap_policy"] == "identical_expected_sets_only"\n\n\ndef test_identical_overlapping_slice_rules_are_allowed():\n    df = pd.DataFrame({"service": ["video"], "slice": ["s1"]})\n    metric = {\n        "input_requirements": {"slice_field": "slice"},\n        "calculation": {"parameters": {"rules": [\n            {"when_field": "service", "operator": "equals", "value": "video", "expected_slice_ids": ["s1"]},\n            {"when_field": "service", "operator": "contains", "value": "vid", "expected_slice_ids": ["s1"]},\n        ]}},\n        "_shared_df": df,\n    }\n    ok, payload = run_slice_identifier_consistency_metric(Path("unused.csv"), metric)\n    result = payload["test_results"]["slice_identifier_consistency_profile"]\n    assert ok is True\n    assert result["slice_identifier_consistency_ratio"] == 1.0\n    assert result["overlap_policy"] == "identical_expected_sets_only"\n\n\ndef test_tcp_flag_metric_declares_aggregate_not_state_machine_scope():\n    df = pd.DataFrame({\n        "Protocol": [6],\n        "Fwd": [1],\n        "Bwd": [1],\n        "SYN": [1],\n        "ACK": [1],\n        "FIN": [0],\n        "RST": [0],\n    })\n    metric = {\n        "input_requirements": {"field_map": {\n            "protocol": "Protocol",\n            "total_fwd_packets": "Fwd",\n            "total_bwd_packets": "Bwd",\n            "syn_flag_count": "SYN",\n            "ack_flag_count": "ACK",\n            "fin_flag_count": "FIN",\n            "rst_flag_count": "RST",\n        }},\n        "calculation": {"parameters": {}},\n        "_shared_df": df,\n    }\n    ok, payload = run_tcp_flag_consistency_metric(Path("unused.csv"), metric)\n    result = payload["test_results"]["tcp_flag_consistency_profile"]\n    assert ok is True\n    assert result["scope"] == "aggregate_tcp_flag_count_invariants"\n''', encoding='utf-8')

          # Record the resolutions in the audit document. Paper wording sync is a
          # separate companion-repository task, but the code contract is frozen here.
          p = Path('docs/paper_metric_traceability_audit.md')
          text = p.read_text(encoding='utf-8')
          replacements = {
              '| High | Several automatically adapted PCAP metrics are decoder/self-derived and therefore non-independent | **Open — experiment blocker** |':
              '| High | Several automatically adapted PCAP metrics are decoder/self-derived and therefore non-independent | **Resolved — excluded from automatic PCAP evidence** |',
              '| Medium/High | Generic Missing Value Ratio on the canonical PCAP view can treat structurally absent fields as data-quality defects | **Open — experiment blocker for generic PCAP use** |':
              '| Medium/High | Generic Missing Value Ratio on the canonical PCAP view can treat structurally absent fields as data-quality defects | **Resolved — excluded pending an applicability-aware denominator** |',
              '| Medium | Multi-field train/test identifier contamination needs an explicit field-qualified identifier universe in the paper | **Open — paper clarification** |':
              '| Medium | Multi-field train/test identifier contamination needs an explicit field-qualified identifier universe in the paper | **Code contract frozen — field-qualified `(field, value)` universe; paper sync pending** |',
              '| Medium | TCP Flag Consistency wording can be read as a full TCP state-machine check, while implementation checks aggregate flag-count invariants | **Open — paper clarification** |':
              '| Medium | TCP Flag Consistency wording can be read as a full TCP state-machine check, while implementation checks aggregate flag-count invariants | **Code contract frozen — aggregate flag-count invariant; paper sync pending** |',
              '| Medium | Overlapping slice-consistency rules use union semantics, which can make conflicting rules more permissive | **Open — freeze decision required** |':
              '| Medium | Overlapping slice-consistency rules use union semantics, which can make conflicting rules more permissive | **Resolved — conflicting overlaps rejected; identical overlaps allowed** |',
              '- [ ] F4 PCAP decoder-derived metrics are excluded from independent evidence or given a defensible raw-field implementation.':
              '- [x] F4 PCAP decoder-derived metrics are excluded from automatic independent evidence; manual diagnostic handlers remain available.',
              '- [ ] F5 PCAP missingness receives an applicability-aware denominator or is excluded from canonical PCAP evidence.':
              '- [x] F5 Generic PCAP missingness is excluded from automatic evidence pending an applicability-aware denominator.',
              '- [ ] F6 identifier-contamination notation is made unambiguous in the paper.':
              '- [x] F6 Code contract uses field-qualified `(field, value)` identifiers; companion paper wording must be synchronised before freeze.',
              '- [ ] F7 TCP flag metric scope is stated precisely in the paper.':
              '- [x] F7 Code/result contract explicitly states aggregate TCP flag-count invariants; companion paper wording must be synchronised before freeze.',
              '- [ ] F8 slice-rule overlap semantics are frozen and tested.':
              '- [x] F8 Slice-rule overlap semantics are frozen and tested: conflicting expected sets are rejected.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Audit text not found: {old}')
              text = text.replace(old, new, 1)
          marker = '## Pre-experiment freeze checklist\n'
          resolution = '''## Resolution update — 14 September 2026\n\nThe code-side experiment blockers identified as F4–F8 are now resolved/frozen on this audit branch. Automatic PCAP planning excludes adapter/decoder-derived validity evidence and generic packet-view missingness; historical/manual handlers remain available for diagnostic replay. Identifier contamination uses field-qualified namespaces, TCP flag consistency declares aggregate-flow scope, and conflicting overlapping slice rules fail configuration rather than being unioned. The companion paper must now be synchronised to these frozen contracts before the final code/paper tag is created.\n\n'''
          if resolution not in text:
              text = text.replace(marker, resolution + marker, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run focused conformance tests
        run: |
          python -m pytest -q tests/test_preexperiment_metric_contract.py tests/test_pcap_adapter.py tests/test_pcap_all_runnable_metrics.py tests/test_plan_builder.py tests/test_label_fidelity_profile.py tests/test_slice_identifier_denominator_policy.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Regenerate checked-in references
        run: python scripts/build_reference_documentation.py
      - name: Verify generated references
        run: python scripts/build_reference_documentation.py --check
      - name: Commit fixes and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-preexperiment-conformance.yml
          git add runner/pcap_adapter.py runner/plan_builder.py \
            cbr_tests/metrics/label_fidelity.py \
            cbr_tests/metrics/protocol_network/flow_semantics/tcp_flag_consistency_profile.py \
            cbr_tests/metrics/protocol_network/slice_metadata_integrity/slice_identifier_consistency_profile.py \
            tests/test_pcap_adapter.py tests/test_pcap_all_runnable_metrics.py tests/test_plan_builder.py \
            tests/test_preexperiment_metric_contract.py docs/paper_metric_traceability_audit.md \
            docs/function_reference.md docs/test_reference.md
          git commit -m "Freeze pre-experiment metric contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
