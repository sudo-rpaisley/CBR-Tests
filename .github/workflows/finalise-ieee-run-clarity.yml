name: Finalise IEEE run clarity

on:
  push:
    branches:
      - overhaul/metric-conformance

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/metric-conformance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Refresh stale README statements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          old = 'Automatic plans for `.pcap`/`.pcapng` include **21 existing metrics that are currently runnable from raw packet evidence without inventing research configuration**.'
          new = 'Automatic plans for `.pcap`/`.pcapng` include **20 metrics that are currently runnable from raw packet evidence without inventing research configuration**.'
          if old not in text:
              raise SystemExit('raw-PCAP count sentence not found')
          text = text.replace(old, new, 1)
          old = 'These configured additions are deliberately kept separate from the 21 configuration-free automatic metrics so the reported count never implies that research assumptions were inferred automatically.'
          new = 'These configured additions are deliberately kept separate from the 20 configuration-free automatic metrics so the reported count never implies that research assumptions were inferred automatically.'
          if old not in text:
              raise SystemExit('second raw-PCAP count sentence not found')
          text = text.replace(old, new, 1)
          old = 'Foundational metrics have moved to `cbr_tests.metrics`. Legacy import modules remain as compatibility shims. Label, slice, reference-comparison, and nested network-realism implementations are still being migrated out of `tests/`; see [Architecture](docs/architecture.md) for the exact boundary.'
          new = 'Canonical production metric implementations now live beneath `cbr_tests/metrics/`. Legacy import modules under `tests/` remain only as compatibility shims where historical imports require them; production dispatch no longer depends on the test package for those metric families. See [Architecture](docs/architecture.md) for the current boundary.'
          if old not in text:
              raise SystemExit('architecture note not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Regenerate docs and run full suite
        run: |
          python scripts/build_reference_documentation.py
          python -m compileall -q cbr_tests runner scripts tests
          python -m pytest -q
      - name: Commit verified documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/function_reference.md docs/test_reference.md
          if git diff --cached --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git commit -m "Refresh docs for canonical PCAP run semantics"
          git push origin HEAD:overhaul/metric-conformance
