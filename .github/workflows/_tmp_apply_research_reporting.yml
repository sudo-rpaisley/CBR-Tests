name: Apply research-ready experiment reporting

on:
  push:
    branches:
      - feature/experiment-result-reporting

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/experiment-result-reporting
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply reporting implementation and tests
        run: |
          base64 -d scripts/_tmp_batch_reports_payload.gz.b64 | gzip -d > runner/batch_reports.py
          base64 -d scripts/_tmp_test_batch_reports_payload.gz.b64 | gzip -d > tests/test_batch_reports.py
          python - <<'PY'
          from pathlib import Path

          path = Path('run_batch.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if comparison_reports:\n        print(f"Comparison overview CSV: {comparison_reports['comparison_overview_csv']}")\n        print(f"Comparison long CSV: {comparison_reports['comparison_long_csv']}")\n        print(f"Comparison Markdown: {comparison_reports['comparison_markdown']}")\n        print(f"Metric matrices: {comparison_reports['comparison_matrices_directory']}")\n'''
          new = '''    if comparison_reports:\n        print(f"Run overview: {comparison_reports['run_readme']}")\n        print(f"Candidate summary: {comparison_reports['candidate_summary_csv']}")\n        print(f"Attention report: {comparison_reports['attention_csv']}")\n        print(f"Detailed comparison report: {comparison_reports['comparison_markdown']}")\n        print(f"Analysis tables: {comparison_reports['comparison_matrices_directory']}")\n'''
          if old not in text:
              raise SystemExit('Expected comparison-report print block not found in run_batch.py')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          docs = Path('docs/batch_execution.md')
          doc_text = docs.read_text(encoding='utf-8')
          heading = '## Research-ready comparison reports'
          if heading not in doc_text:
              doc_text += '''\n\n## Research-ready comparison reports\n\nReference-comparison batches also produce a concise run-level `README.md` and several derived report tables under `reports/`. The authoritative evidence remains the individual JSON outcomes under `results/`; the report files are denormalised views intended to make large experiment matrices reviewable without opening every JSON file.\n\nThe key derived files are:\n\n- `candidate_summary.csv`: one row per candidate, with intrinsic verdicts deduplicated across repeated all-v-all reference jobs and reference verdicts counted separately;\n- `job_summary.csv`: one row per candidate/reference comparison;\n- `taxonomy_summary.csv`: verdict and execution counts grouped by taxonomy dimension and by intrinsic/reference scope;\n- `attention.csv`: execution problems plus domain `WARN`/`FAIL` results with diagnostic reason codes where available;\n- `overview.csv` and `long.csv`: wide and long-form reference-comparison values for analysis;\n- `matrices/`: candidate × reference matrices for each reference-comparison metric.\n\nThe generated Markdown report explicitly separates execution status from domain verdicts and does **not** calculate an aggregate realism score. Intrinsic metrics are counted once per candidate in candidate-level summaries even when an all-v-all matrix repeats them for every reference pairing. If repeated intrinsic verdicts disagree, the candidate summary records that inconsistency rather than hiding it.\n'''
              docs.write_text(doc_text, encoding='utf-8')
          PY

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run focused regression tests
        run: |
          python -m compileall -q runner/batch_reports.py run_batch.py
          python -m pytest -q tests/test_batch_reports.py tests/test_result_layout.py tests/test_batch_state.py tests/test_campaign_queue.py

      - name: Refresh generated references
        run: |
          python scripts/build_reference_documentation.py
          python scripts/build_reference_documentation.py --check

      - name: Remove temporary staging helpers
        run: |
          rm scripts/_tmp_batch_reports_payload.gz.b64
          rm scripts/_tmp_test_batch_reports_payload.gz.b64
          rm .github/workflows/_tmp_apply_research_reporting.yml

      - name: Commit final reporting implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add research-ready experiment reporting"
          git push origin HEAD:feature/experiment-result-reporting
