name: Refresh preflight advice references

on:
  push:
    branches:
      - agent/preflight-unlock-advice

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preflight-unlock-advice
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: |
          python scripts/build_reference_documentation.py
          python scripts/build_reference_documentation.py --check
      - name: Commit refreshed references and remove temporary workflow
        run: |
          rm .github/workflows/refresh-preflight-advice-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/function_reference.md docs/test_reference.md .github/workflows/refresh-preflight-advice-docs.yml
          git commit -m "Refresh references after preflight advice cleanup"
          git push
