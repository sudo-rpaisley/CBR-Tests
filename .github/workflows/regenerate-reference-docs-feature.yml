name: Regenerate feature reference docs

on:
  push:
    branches:
      - feature/multi-dataset-plan-batches

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[docs-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/multi-dataset-plan-batches

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate references
        run: python scripts/build_reference_documentation.py

      - name: Commit regenerated references
        run: |
          if git diff --quiet -- docs/function_reference.md docs/test_reference.md; then
            echo "Reference documentation already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/function_reference.md docs/test_reference.md
          git commit -m "Regenerate reference documentation [docs-generated]"
          git push origin HEAD:feature/multi-dataset-plan-batches
