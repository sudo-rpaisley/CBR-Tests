name: Finalise PCAP evidence classification

on:
  push:
    branches:
      - audit/paper-metric-traceability

permissions:
  contents: write

jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/paper-metric-traceability
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Apply plan-manifest evidence classification
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('runner/plan_builder.py')
          text = p.read_text(encoding='utf-8')
          old = 'from runner.field_translation import (\n'
          new = 'from runner.evidence_classification import pcap_evidence_class\nfrom runner.field_translation import (\n'
          if 'from runner.evidence_classification import pcap_evidence_class' not in text:
              if old not in text:
                  raise SystemExit('plan_builder import anchor missing')
              text = text.replace(old, new, 1)
          old = '        metrics.append(_metric_from_spec(spec))\n'
          new = '''        planned_metric = _metric_from_spec(spec)\n        if dataset["format"] in {"pcap", "pcapng"}:\n            planned_metric["evidence_class"] = pcap_evidence_class(metric_id)\n        metrics.append(planned_metric)\n'''
          if old not in text:
              raise SystemExit('plan_builder metric append anchor missing')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run evidence classification tests
        run: python -m pytest -q tests/test_pcap_evidence_classification.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Regenerate reference documentation
        run: python scripts/build_reference_documentation.py
      - name: Verify generated reference documentation
        run: python scripts/build_reference_documentation.py --check
      - name: Commit and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalise-evidence-classification.yml
          git add runner/plan_builder.py runner/evidence_classification.py tests/test_pcap_evidence_classification.py docs/function_reference.md docs/test_reference.md
          git commit -m "Record PCAP evidence classes in generated plans"
          git push origin HEAD:audit/paper-metric-traceability
