name: Finalize comparison report references

on:
  push:
    branches:
      - feature/comparison-csv-matrices

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[comparison-reports-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/comparison-csv-matrices

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile and run tests
        run: |
          python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
          python -m pytest -q

      - name: Regenerate references
        run: python scripts/build_reference_documentation.py

      - name: Remove temporary workflow
        run: rm .github/workflows/finalize-comparison-reports.yml

      - name: Commit finalized feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/function_reference.md docs/test_reference.md .github/workflows/finalize-comparison-reports.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Regenerate comparison report references [comparison-reports-finalized]"
          git push origin HEAD:feature/comparison-csv-matrices
