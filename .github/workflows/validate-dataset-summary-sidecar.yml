name: Validate dataset summary sidecar

on:
  push:
    branches: [agent/dataset-summary-sidecar]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dataset-summary-sidecar
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Apply integration patch
        run: python scripts/apply_dataset_summary_integration.py
      - name: Compile
        run: python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
      - name: Targeted dataset summary tests
        run: python -m pytest -q tests/test_dataset_summary.py tests/test_dataset_summary_controls.py
      - name: Full suite
        run: python -m pytest -q
      - name: Remove temporary validation files
        run: |
          rm scripts/apply_dataset_summary_integration.py
          rm .github/workflows/validate-dataset-summary-sidecar.yml
      - name: Refresh generated references after cleanup
        run: |
          python scripts/build_reference_documentation.py
          python scripts/build_reference_documentation.py --check
      - name: Commit validated dataset summary feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add hash-aware dataset summary sidecars'
            git push origin HEAD:agent/dataset-summary-sidecar
          fi
