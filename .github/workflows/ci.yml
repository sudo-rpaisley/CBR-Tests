name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .

      - name: Generate exhaustive references
        if: matrix.python-version == '3.11'
        run: python scripts/build_reference_documentation.py

      - name: Commit generated references
        if: matrix.python-version == '3.11' && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/function_reference.md docs/test_reference.md
          if ! git diff --cached --quiet; then
            git commit -m "Generate exhaustive function and test references"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Run documented quickstart
        if: matrix.python-version == '3.11'
        run: |
          python run_plan.py \
            --case examples/quickstart/case.json \
            --workers 1 \
            --display quiet \
            --no-update-field-translation
          python - <<'PY'
          import json
          from pathlib import Path

          outcome_path = Path("outcomes/quickstart_example.json")
          outcome = json.loads(outcome_path.read_text(encoding="utf-8"))
          assert outcome["schema_version"] == 1
          assert outcome["status"] == "success"
          assert len(outcome["metric_results"]) == 4
          assert set(outcome["test_results"]) == {
              "column_quality_profile",
              "missing_value_ratio",
              "duplicate_row_ratio",
              "pearson_correlation_profile",
          }
          PY
          rm -f outcomes/quickstart_example.json

      - name: Run test suite
        run: python -m pytest -q --junitxml=test-results-${{ matrix.python-version }}.xml

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml
          if-no-files-found: ignore
          retention-days: 7
