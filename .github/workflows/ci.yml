name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .

      - name: Build documentation inventory
        if: matrix.python-version == '3.11'
        run: |
          python scripts/build_documentation_inventory.py \
            --json documentation-inventory.json \
            --markdown documentation-inventory.md

      - name: Upload documentation inventory
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-inventory
          path: |
            documentation-inventory.json
            documentation-inventory.md
          if-no-files-found: error
          retention-days: 7

      - name: Run test suite
        run: python -m pytest -q --junitxml=test-results-${{ matrix.python-version }}.xml

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml
          if-no-files-found: ignore
          retention-days: 7
