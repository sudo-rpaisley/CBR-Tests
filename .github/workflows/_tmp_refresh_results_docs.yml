name: Refresh generated docs for results layout

on:
  push:
    branches:
      - feature/hierarchical-experiment-results

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hierarchical-experiment-results
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh generated documentation
        run: python scripts/build_reference_documentation.py
      - name: Remove temporary workflow
        run: rm .github/workflows/_tmp_refresh_results_docs.yml
      - name: Commit refreshed docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh generated documentation"
          git push origin HEAD:feature/hierarchical-experiment-results
