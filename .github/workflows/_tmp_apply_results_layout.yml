name: Apply organised experiment results layout

on:
  push:
    branches:
      - feature/hierarchical-experiment-results

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hierarchical-experiment-results
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply layout refactor
        run: |
          python scripts/_tmp_organise_experiment_results.py
          python scripts/_tmp_preserve_retry_filename.py
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run focused tests
        run: |
          python -m compileall -q run_batch.py run_campaign.py runner/batch_reports.py
          python -m pytest -q tests/test_result_layout.py tests/test_batch_reports.py tests/test_batch_state.py tests/test_campaign_queue.py
      - name: Refresh generated references
        run: python scripts/build_reference_documentation.py
      - name: Remove temporary helpers
        run: |
          rm scripts/_tmp_organise_experiment_results.py
          rm scripts/_tmp_preserve_retry_filename.py
          rm .github/workflows/_tmp_apply_results_layout.yml
      - name: Commit final refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Organise experiment results hierarchically"
          git push origin HEAD:feature/hierarchical-experiment-results
