name: Temporary reference documentation regeneration

on:
  push:
    branches:
      - improve/metric-sampling-timing-memory

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate reference documentation
        run: python scripts/build_reference_documentation.py
      - name: Upload regenerated documentation
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-reference-docs
          path: |
            docs/function_reference.md
            docs/test_reference.md
