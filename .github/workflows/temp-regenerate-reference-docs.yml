name: Temporary reference documentation regeneration

on:
  push:
    branches:
      - improve/metric-sampling-timing-memory

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate reference documentation
        run: python scripts/build_reference_documentation.py
      - name: Commit regenerated documentation
        run: |
          if git diff --quiet -- docs/function_reference.md docs/test_reference.md; then
            echo "Reference documentation already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/function_reference.md docs/test_reference.md
          git commit -m "Regenerate reference documentation"
          git push origin HEAD:improve/metric-sampling-timing-memory
