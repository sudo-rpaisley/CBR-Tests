name: Update result semantics (overhaul)

on:
  push:
    branches:
      - overhaul/metric-conformance

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhaul/metric-conformance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Patch TUI semantics and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('runner/tui.py')
          text = path.read_text()
          import_marker = 'from pathlib import Path\n'
          import_line = 'from runner.result_semantics import metric_result_semantics, scientific_status_fragments\nfrom cbr_tests.plan_migration import LEGACY_INTRINSIC_METRIC_MIGRATIONS\n'
          if import_line not in text:
              if import_marker not in text:
                  raise SystemExit('TUI import marker not found')
              text = text.replace(import_marker, import_marker + '\n' + import_line, 1)

          old = '''def _metric_result_line(metric: dict, test_results: dict) -> str:\n    metric_id = metric.get("metric_id", "unknown_metric")\n    status = metric.get("status", "unknown")\n    elapsed = metric.get("elapsed_seconds")\n    parts = [metric_id, f"status={status}"]\n    if elapsed is not None:\n        parts.append(f"elapsed={float(elapsed):.1f}s")\n    reason = metric.get("reason") or metric.get("error") or metric.get("message")\n    if reason:\n        parts.append(f"detail={reason}")\n    summary_items = _scalar_summary_items(_test_result_for_metric(test_results, metric_id))\n    if summary_items:\n        parts.append("; ".join(summary_items))\n    return " | ".join(parts)\n\n\ndef _outcome_result_sections(output_path: str | None) -> tuple[list[str], list[str], list[str], list[str]]:\n    payload = _load_outcome_payload(output_path)\n    metric_results = payload.get("metric_results", []) if isinstance(payload, dict) else []\n    test_results = payload.get("test_results", {}) if isinstance(payload, dict) else {}\n    readable: list[str] = []\n    failed: list[str] = []\n    skipped: list[str] = []\n    success: list[str] = []\n    for metric in metric_results:\n        line = _metric_result_line(metric, test_results)\n        readable.append(line)\n        status = metric.get("status", "unknown")\n        if status == "failed":\n            failed.append(line)\n        elif status == "skipped":\n            skipped.append(line)\n        elif status == "success":\n            success.append(line)\n    if not readable and isinstance(test_results, dict):\n        readable = [f"{key}: {', '.join(_scalar_summary_items(value)) or 'result available'}" for key, value in test_results.items()]\n    return readable, success, failed, skipped\n'''
          new = '''def _metric_result_line(metric: dict, test_results: dict) -> str:\n    metric_id = metric.get("metric_id", "unknown_metric")\n    execution = metric.get("status", "unknown")\n    elapsed = metric.get("elapsed_seconds")\n    scientific_payload = _test_result_for_metric(test_results, metric_id)\n    parts = [metric_id, f"execution={execution}"]\n    parts.extend(scientific_status_fragments(scientific_payload))\n    if metric_id in LEGACY_INTRINSIC_METRIC_MIGRATIONS:\n        parts.append("id_contract=legacy_compatibility")\n    if elapsed is not None:\n        parts.append(f"elapsed={float(elapsed):.1f}s")\n    reason = metric.get("reason") or metric.get("error") or metric.get("message")\n    if reason:\n        parts.append(f"detail={reason}")\n    summary_items = _scalar_summary_items(scientific_payload)\n    if summary_items:\n        parts.append("; ".join(summary_items))\n    return " | ".join(parts)\n\n\ndef _outcome_result_sections(output_path: str | None) -> dict[str, list[str]]:\n    payload = _load_outcome_payload(output_path)\n    metric_results = payload.get("metric_results", []) if isinstance(payload, dict) else []\n    test_results = payload.get("test_results", {}) if isinstance(payload, dict) else {}\n    sections = {\n        "readable": [],\n        "execution_success": [],\n        "execution_failed": [],\n        "execution_skipped": [],\n        "not_runnable": [],\n        "verdict_pass": [],\n        "verdict_warn": [],\n        "verdict_fail": [],\n        "legacy": [],\n    }\n    for metric in metric_results:\n        metric_id = metric.get("metric_id", "unknown_metric")\n        line = _metric_result_line(metric, test_results)\n        sections["readable"].append(line)\n        execution = metric.get("status", "unknown")\n        if execution == "failed":\n            sections["execution_failed"].append(line)\n        elif execution == "skipped":\n            sections["execution_skipped"].append(line)\n        elif execution == "success":\n            sections["execution_success"].append(line)\n\n        semantics = metric_result_semantics(_test_result_for_metric(test_results, metric_id))\n        if semantics["runnable"] is False:\n            sections["not_runnable"].append(line)\n        verdict = semantics["verdict"]\n        if verdict in {"pass", "warn", "fail"}:\n            sections[f"verdict_{verdict}"].append(line)\n        if metric_id in LEGACY_INTRINSIC_METRIC_MIGRATIONS:\n            replacement = LEGACY_INTRINSIC_METRIC_MIGRATIONS[metric_id]["metric_id"]\n            sections["legacy"].append(f"{metric_id} -> {replacement}")\n\n    if not sections["readable"] and isinstance(test_results, dict):\n        sections["readable"] = [\n            f"{key}: {', '.join(_scalar_summary_items(value)) or 'result available'}"\n            for key, value in test_results.items()\n        ]\n    return sections\n'''
          if old not in text:
              raise SystemExit('TUI result semantics block not found')
          text = text.replace(old, new, 1)

          old = '''    readable, success, failed, skipped = _outcome_result_sections(result.get("output_path"))\n    sections = [ResultSection("Summary", summary, True)]\n    if readable:\n        sections.append(ResultSection(f"Human-readable metric results ({len(readable)})", readable, False))\n    if success:\n        sections.append(ResultSection(f"Successful metrics ({len(success)})", success, False))\n    if failed:\n        sections.append(ResultSection(f"Failed metrics ({len(failed)})", failed, False))\n    if skipped:\n        sections.append(ResultSection(f"Skipped metrics ({len(skipped)})", skipped, False))\n'''
          new = '''    result_groups = _outcome_result_sections(result.get("output_path"))\n    sections = [ResultSection("Summary", summary, True)]\n    if result_groups["legacy"]:\n        legacy_lines = [\n            "This outcome used legacy compatibility metric IDs. Migrate the saved plan before treating a rerun as canonical:",\n            *result_groups["legacy"],\n            "Use: python scripts/migrate_plan_to_canonical_ids.py <plan.json>",\n        ]\n        sections.append(ResultSection(f"Legacy compatibility IDs ({len(result_groups['legacy'])})", legacy_lines, True))\n    readable = result_groups["readable"]\n    if readable:\n        sections.append(ResultSection(f"Human-readable metric results ({len(readable)})", readable, False))\n    execution_success = result_groups["execution_success"]\n    if execution_success:\n        sections.append(ResultSection(f"Execution succeeded ({len(execution_success)})", execution_success, False))\n    not_runnable = result_groups["not_runnable"]\n    if not_runnable:\n        sections.append(ResultSection(f"Scientifically not runnable / not applicable ({len(not_runnable)})", not_runnable, True))\n    for verdict, title in (("pass", "Verdict PASS"), ("warn", "Verdict WARN"), ("fail", "Verdict FAIL")):\n        lines = result_groups[f"verdict_{verdict}"]\n        if lines:\n            sections.append(ResultSection(f"{title} ({len(lines)})", lines, verdict != "pass"))\n    failed = result_groups["execution_failed"]\n    if failed:\n        sections.append(ResultSection(f"Execution failed ({len(failed)})", failed, True))\n    skipped = result_groups["execution_skipped"]\n    if skipped:\n        sections.append(ResultSection(f"Execution skipped ({len(skipped)})", skipped, False))\n'''
          if old not in text:
              raise SystemExit('TUI build_result_sections block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          test_path = Path('tests/test_tui.py')
          test = test_path.read_text()
          test = test.replace(
              'assert "m1 | status=failed | elapsed=1.2s | detail=boom" in sections[1].lines\n    assert "m2 | status=success | elapsed=2.0s | ratio=0.95" in sections[1].lines\n    assert any(section.title == "Successful metrics (1)" for section in sections)\n    assert any(section.title == "Failed metrics (1)" for section in sections)',
              'assert "m1 | execution=failed | elapsed=1.2s | detail=boom" in sections[1].lines\n    assert "m2 | execution=success | elapsed=2.0s | ratio=0.95" in sections[1].lines\n    assert any(section.title == "Execution succeeded (1)" for section in sections)\n    assert any(section.title == "Execution failed (1)" for section in sections)',
          )
          test += '''\n\ndef test_result_sections_separate_execution_success_from_scientific_applicability(tmp_path):\n    output = tmp_path / "outcome.json"\n    output.write_text(\n        json.dumps({\n            "metric_results": [\n                {"metric_id": "day_to_day_diurnal_similarity", "status": "success", "elapsed_seconds": 1.0},\n                {"metric_id": "valid_port_range_profile", "status": "success", "elapsed_seconds": 0.2},\n            ],\n            "test_results": {\n                "day_to_day_diurnal_similarity": {"summary": {"runnable": False, "observed_day_count": 1, "interpretation_direction": "contextual"}},\n                "valid_port_range_profile": {"summary": {"runnable": True, "status": "pass", "valid_port_range_ratio": 1.0}},\n            },\n        }),\n        encoding="utf-8",\n    )\n    sections = build_result_sections({"dry_run": False, "status": "success", "output_path": str(output), "metrics_total": 2, "skipped_count": 0})\n    titles = {section.title for section in sections}\n    assert "Execution succeeded (2)" in titles\n    assert "Scientifically not runnable / not applicable (1)" in titles\n    assert "Verdict PASS (1)" in titles\n    readable = next(section for section in sections if section.title.startswith("Human-readable metric results"))\n    assert any("execution=success | runnable=no | interpretation=contextual" in line for line in readable.lines)\n\n\ndef test_result_sections_flag_legacy_intrinsic_ids(tmp_path):\n    output = tmp_path / "legacy.json"\n    output.write_text(\n        json.dumps({\n            "metric_results": [{"metric_id": "wasserstein_feature_distance", "status": "success"}],\n            "test_results": {"wasserstein_feature_distance": {"summary": {"mean_wasserstein_distance": 1.0}}},\n        }),\n        encoding="utf-8",\n    )\n    sections = build_result_sections({"dry_run": False, "status": "success", "output_path": str(output), "metrics_total": 1, "skipped_count": 0})\n    legacy = next(section for section in sections if section.title == "Legacy compatibility IDs (1)")\n    assert any("wasserstein_feature_distance -> feature_wasserstein_internal_drift" in line for line in legacy.lines)\n'''
          if 'import json\n' not in test.splitlines()[:5]:
              test = 'import json\n' + test
          test_path.write_text(test)
          PY
      - name: Regenerate docs and test
        run: |
          python scripts/build_reference_documentation.py
          python -m compileall -q cbr_tests runner scripts tests
          python -m pytest -q
      - name: Commit result semantics update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner/tui.py tests/test_tui.py docs/function_reference.md docs/test_reference.md
          git commit -m "Distinguish execution success from scientific applicability in TUI"
          git push origin HEAD:overhaul/metric-conformance
