name: Apply campaign batch picker refactor

on:
  push:
    branches:
      - feature/campaign-folder-matrix-import

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-folder-matrix-import
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply refactor
        run: python scripts/_tmp_simplify_campaign_batch_picker.py
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check focused campaign tests
        run: |
          python -m compileall -q runner/campaign_tui.py
          python -m pytest -q tests/test_campaign_batch_picker.py tests/test_campaign_queue.py
      - name: Refresh generated references
        run: python scripts/build_reference_documentation.py
      - name: Remove temporary refactor helpers
        run: |
          rm scripts/_tmp_simplify_campaign_batch_picker.py
          rm .github/workflows/_tmp_apply_campaign_batch_picker.yml
      - name: Commit final refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner/campaign_tui.py tests/test_campaign_batch_picker.py tests/test_campaign_folder_selection.py docs/function_reference.md docs/test_reference.md scripts/_tmp_simplify_campaign_batch_picker.py .github/workflows/_tmp_apply_campaign_batch_picker.yml
          git commit -m "Simplify campaigns around queued batch matrices"
          git push origin HEAD:feature/campaign-folder-matrix-import
