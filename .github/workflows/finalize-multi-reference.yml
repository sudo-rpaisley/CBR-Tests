name: Finalize multi-reference feature

on:
  push:
    branches:
      - feature/multi-reference-browser-selection

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[multi-reference-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/multi-reference-browser-selection

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preserve legacy singular reference argument
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('create_plan.py')
          text = path.read_text(encoding='utf-8')
          old = '''    reference_dataset_paths: list[Path],\n    service_port_configuration: dict | None,\n    output_path: Path,\n    force: bool,\n    per_dataset_metrics: bool,\n    interactive: bool,\n) -> Path:\n    repo_root = Path.cwd().resolve()\n'''
          new = '''    reference_dataset_paths: list[Path] | None = None,\n    service_port_configuration: dict | None,\n    output_path: Path,\n    force: bool,\n    per_dataset_metrics: bool,\n    interactive: bool,\n    reference_dataset_path: Path | None = None,\n) -> Path:\n    reference_dataset_paths = list(reference_dataset_paths or [])\n    if reference_dataset_path is not None:\n        legacy_reference = Path(reference_dataset_path).expanduser().resolve()\n        if all(path.expanduser().resolve() != legacy_reference for path in reference_dataset_paths):\n            reference_dataset_paths.append(legacy_reference)\n\n    repo_root = Path.cwd().resolve()\n'''
          if old not in text:
              raise SystemExit('Expected _create_batch signature block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile and run tests
        run: |
          python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
          python -m pytest -q

      - name: Regenerate references
        run: python scripts/build_reference_documentation.py

      - name: Remove temporary workflow
        run: rm .github/workflows/finalize-multi-reference.yml

      - name: Commit finalized feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize multi-reference compatibility and documentation [multi-reference-finalized]"
          git push origin HEAD:feature/multi-reference-browser-selection
